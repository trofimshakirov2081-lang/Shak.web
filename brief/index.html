<style>
/* ============ БАЗА ============ */
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#17171a; --muted:#6b6b75; --line:#e4e2dc;
  --accent:#5b4bff; --accent-soft:#ecebff; --ok:#1f9d6a; --radius:16px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --grad:linear-gradient(120deg,#6d5dfc 0%,#b65cf0 50%,#ff7a59 100%); --blob:.3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121215; --card:#1b1b20; --text:#f1f1f4; --muted:#a0a0ab; --line:#2c2c34;
    --accent:#8a7dff; --accent-soft:#25223f; --ok:#3ccf91; --shadow:0 8px 24px rgba(0,0,0,.35); --blob:.16;
  }
}
:root[data-theme="dark"]{
  --bg:#121215; --card:#1b1b20; --text:#f1f1f4; --muted:#a0a0ab; --line:#2c2c34;
  --accent:#8a7dff; --accent-soft:#25223f; --ok:#3ccf91; --shadow:0 8px 24px rgba(0,0,0,.35); --blob:.16;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* шапка */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.progress{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s}
.stepnum{font-size:13px;color:var(--muted);white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;cursor:pointer}

/* шаг */
main{padding:32px 0 120px}
.step-head h1{font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-.03em;margin:0 0 8px}
.step-head p{color:var(--muted);margin:0 0 24px;max-width:680px}
.section{margin:28px 0}
.section h3{font-size:17px;margin:0 0 4px}
.section .hint{color:var(--muted);font-size:14px;margin:0 0 14px}

/* поля */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea,.field select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* чипсы */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 16px;cursor:pointer;font-size:14px;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.idk{border-style:dashed}
.chip.idk.on{background:var(--text);border-color:var(--text);color:var(--bg)}

/* карточки выбора */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 14px;padding-top:10px}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;transition:transform .15s,border-color .15s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-2px)}
.card.on{border-color:var(--accent)}
.card .tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center;font-size:14px;font-weight:800;z-index:2}
.card.on .tick{display:grid}
.card .reco{position:absolute;top:-10px;left:12px;z-index:2;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;display:none}
.card.is-reco .reco{display:block}
.card h4{margin:10px 0 2px;font-size:15px}
.card p{margin:0;color:var(--muted);font-size:13px}
.card.simple{padding:14px 16px}
.card.simple h4{margin-top:0}

/* превью стилей */
.mock{height:150px;border-radius:10px;overflow:hidden;position:relative;padding:12px;display:flex;flex-direction:column;gap:6px}
.mock .nav{display:flex;justify-content:space-between;align-items:center;font-size:9px;opacity:.85}
.mock .nav span{display:flex;gap:6px}
.mock .h{font-size:17px;line-height:1.05;margin-top:8px;max-width:62%}
.mock .s{font-size:9px;opacity:.7;max-width:55%}
.mock .b{align-self:flex-start;font-size:9px;padding:5px 10px;margin-top:4px}
.mock .img{position:absolute;right:12px;bottom:12px;width:34%;height:60%}
.mock>*:not(.img){position:relative;z-index:1}
.mock.center{align-items:center;text-align:center}
.mock.center .nav{align-self:stretch}
.mock.center .h,.mock.center .s{max-width:85%}
.mock.center .b{align-self:center}
.mock.center .img{left:0;right:0;bottom:0;width:100%;height:16%;opacity:.9}
.mock.full .img{inset:0;width:100%;height:100%}
.mock.full .img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
.mock .bento{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr;gap:5px;width:38%;height:70%}
.mock .bento i:first-child{grid-column:1/3}

/* палитры */
.pal{display:flex;height:70px;border-radius:10px;overflow:hidden}
.pal i{flex:1}

/* шрифты */
.fontprev .big{font-size:28px;line-height:1.1;margin:4px 0 6px}
.fontprev .small{font-size:13px;color:var(--muted)}

/* блоки лендинга */
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.blk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.blk.on{border-color:var(--accent)}
.blk .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;margin-top:2px}
.blk.on .box{background:var(--accent);border-color:var(--accent)}
.blk b{display:block;font-size:14px}
.blk span{font-size:12.5px;color:var(--muted)}
.blk .rb{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}

/* помощник */
.helper{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--radius);padding:14px 18px;margin:0 0 24px}
.helper p{margin:0;flex:1;min-width:220px;font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .2s;background:var(--card);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dark{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* навигация снизу */
.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10}
.bottom{padding-bottom:env(safe-area-inset-bottom)}
.bottom .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;height:72px}
.bottom .note{font-size:13px;color:var(--muted);text-align:center;flex:1}

/* приветствие */
/* фон: медленно плывущие цветные пятна */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:var(--blob);animation:float 24s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:#7c6cff;top:-20vmax;left:-14vmax}
.blobs i:nth-child(2){background:#ff8ac0;top:28%;right:-22vmax;animation-delay:-8s;animation-duration:28s}
.blobs i:nth-child(3){background:#ffb35c;bottom:-26vmax;left:18%;animation-delay:-15s}
@keyframes float{50%{transform:translate(6vmax,4vmax) scale(1.08)}100%{transform:translate(-4vmax,-3vmax) scale(.95)}}

/* фирменные акценты */
.brand,.step-head h1,.wl h1,.modal .mh b{font-family:Unbounded,Manrope,sans-serif}
.brand{font-weight:700}
.step-head h1{font-weight:700;letter-spacing:-.02em;font-size:clamp(23px,3.4vw,34px)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.progress i{background:var(--grad)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 26px -10px rgba(109,93,252,.75)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(109,93,252,.85)}
.card.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow)}
.card{will-change:transform}
.stage{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.just{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.shake{animation:shake .4s}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes fade{from{opacity:0}}

/* приветствие */
.wl{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:12px 0 0}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.wl h1{font-size:clamp(30px,5vw,54px);line-height:1.05;letter-spacing:-.03em;margin:16px 0 14px;font-weight:800}
.wl .lead{font-size:17px;color:var(--muted);margin:0 0 22px;max-width:520px}
.wform{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);max-width:520px}
.wform .field{margin-bottom:12px}
.wform .btn{width:100%;padding:15px;font-size:17px}
.wform small{display:block;color:var(--muted);font-size:12.5px;margin-top:10px;text-align:center}
.stack{position:relative;height:400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stack .sp{position:absolute;left:0;right:0;top:56px;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s;box-shadow:0 30px 60px -24px rgba(20,20,50,.45)}
.stack .sp[data-pos="0"]{transform:rotate(-2deg);z-index:3}
.stack .sp[data-pos="1"]{transform:translate(26px,-28px) rotate(3deg) scale(.95);z-index:2;opacity:.85}
.stack .sp[data-pos="2"]{transform:translate(52px,-54px) rotate(7deg) scale(.9);z-index:1;opacity:.55}
.stack .sp[data-pos="3"]{transform:translate(-80px,60px) rotate(-14deg) scale(.9);opacity:0;z-index:0}
.stack-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.marquee{overflow:hidden;margin:30px -16px 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marquee div{display:flex;gap:10px;width:max-content;animation:marq 60s linear infinite}
.marquee span{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
@keyframes marq{to{transform:translateX(-50%)}}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0 10px}
.how div{background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:18px;font-size:14.5px}
.how b{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;font-size:18px;margin-bottom:12px;font-family:Unbounded}

/* «Ваш сайт» - живое превью по кнопке */
.peek{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:11;display:flex;align-items:center;gap:8px;padding:11px 18px 11px 14px;border-radius:99px;border:0;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.55);cursor:pointer}
.peek[hidden]{display:none}
.peek i{width:9px;height:9px;border-radius:50%;background:var(--grad)}
.peek.pulse{animation:pop .5s}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,10,20,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal .box{background:var(--card);border-radius:22px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto;animation:enter .3s}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal .mh b{font-size:16px}
.modal .nav2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.modal .nav2 small{color:var(--muted);text-align:center;font-size:12.5px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.stepnum b{font-weight:600;color:var(--text);margin-right:6px}

/* итог */
.doc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.doc h2{margin:28px 0 10px;font-size:20px;letter-spacing:-.02em}
.doc h2:first-child{margin-top:0}
.doc table{width:100%;border-collapse:collapse;font-size:14.5px}
.doc td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.doc td:first-child{color:var(--muted);width:38%;padding-right:12px}
.bb{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bb .sw{display:flex;gap:8px;flex-wrap:wrap}
.bb .sw{flex-wrap:nowrap!important}
.bb .sw div{flex:1;min-width:0}
.bb .sw i{display:block;height:56px;border-radius:12px;border:1px solid var(--line)}
.bb .sw small{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-family:ui-monospace,monospace}
.send{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:20;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);font-style:italic}

/* живое превью сайта */
.sp{border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;line-height:1.3;border:1px solid rgba(127,127,127,.18)}
.sp-hero{position:relative;padding:14px 16px 22px;display:flex;flex-direction:column;gap:8px;min-height:210px}
.sp-hero>*{position:relative;z-index:1}
.sp-nav{display:flex;justify-content:space-between;align-items:center;font-size:10px;gap:8px;margin-bottom:12px}
.sp-nav b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.sp-nav span{display:flex;gap:8px;opacity:.75;white-space:nowrap;overflow:hidden}
.sp-h{font-size:23px;line-height:1.08;max-width:60%;overflow-wrap:anywhere}
.sp-s{font-size:11px;opacity:.78;max-width:58%}
.sp-b{align-self:flex-start;padding:8px 14px;font-size:11px;font-weight:700;margin-top:4px}
.sp-hero>.sp-art{position:absolute;z-index:0;right:16px;top:46px;bottom:22px;width:33%}
.sp-art.bento{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr;gap:6px}
.sp-art.bento i:first-child{grid-column:1/3}
.sp.center .sp-hero{align-items:center;text-align:center}
.sp.center .sp-nav{align-self:stretch}
.sp.center .sp-h,.sp.center .sp-s{max-width:92%}
.sp.center .sp-b{align-self:center}
.sp.full .sp-hero{min-height:240px;color:#fff}
.sp.full .sp-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.05));z-index:0}
.sp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 16px}
.sp-row div{padding:10px;font-size:10px;min-height:66px;display:flex;flex-direction:column;gap:6px}
.sp-row i{width:16px;height:16px;border-radius:50%;flex:none}
.sp-row b{font-weight:600;hyphens:auto;overflow-wrap:break-word}
.previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.previews figure{margin:0}
.previews figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}

/* свайп-тест */
.deck{position:relative;height:430px;max-width:380px;margin:6px auto 0}
.swc{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:12px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .25s ease}
.swc.drag{transition:none;cursor:grabbing}
.swc.back{transform:scale(.94) translateY(16px);opacity:.6;pointer-events:none}
.swc h4{margin:12px 4px 0;font-size:17px}
.swc p{margin:2px 4px 0;color:var(--muted);font-size:13px}
.swc .stamp{position:absolute;top:26px;padding:4px 14px;border-radius:10px;font-weight:800;font-size:22px;border:3px solid;opacity:0;z-index:5;background:var(--card)}
.swc .yes{left:22px;color:var(--ok);transform:rotate(-12deg)}
.swc .no{right:22px;color:#e5484d;transform:rotate(12deg)}
.swbtns{display:flex;justify-content:center;align-items:center;gap:22px;margin:22px 0 8px}

function shortList(key, all, rec){
  const ids = all.map(x => x.id);
  const order = [...new Set(rec.filter(id => ids.includes(id)).concat(A[key], ids))];
  const shown = MORE[key] ? order : [...new Set(order.slice(0, SHORT[key]).concat(A[key]))];
  const rest = order.length - shown.length;
  return {items: shown.map(id => all.find(x => x.id === id)), more: rest > 0 ? `<button class="btn more-btn" data-more="${key}">Показать ещё ${rest}</button>` : ''};
}

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// рекомендации по всем выбранным нишам (по очереди берём лучшие варианты каждой)
const niche = () => {
  const ns = A.niches.map(id => NICHES.find(n => n.id === id)).filter(Boolean);
  if(!ns.length) ns.push(NICHES.find(n => n.id === 'other'));
  const mix = key => [...new Set([0,1,2].flatMap(i => ns.map(n => n[key][i])))];
  return {styles:mix('styles'), pals:mix('pals'), fonts:mix('fonts')};
};
const toggle = (arr, v) => { const i = arr.indexOf(v); if(i > -1) arr.splice(i,1); else arr.push(v); };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }

function head(title, text){ return `<div class="step-head"><h1>${title}</h1><p>${text}</p></div>`; }
function helper(text, action){ return `<div class="helper"><p>🤔 ${text}</p><button class="btn primary sm" data-auto="${action}">Подобрать за меня</button></div>`; }
function input(key, label, ph='', type='text'){ return `<div class="field"><label>${label}</label><input type="${type}" data-k="${key}" value="${esc(A[key])}" placeholder="${esc(ph)}"></div>`; }
function area(key, label, ph=''){ return `<div class="field"><label>${label}</label><textarea data-k="${key}" placeholder="${esc(ph)}">${esc(A[key])}</textarea></div>`; }
function chips(key, list, multi=true, idk=false){
  const val = A[key];
  return `<div class="chips">${list.map(v => {
    const on = multi ? val.includes(v) : val === v;
    return `<div class="chip ${on?'on':''}" data-chip="${key}" data-multi="${multi?1:0}" data-v="${esc(v)}">${esc(v)}</div>`;
  }).join('')}${idk ? `<div class="chip idk ${(multi?val.includes('Не знаю'):val==='Не знаю')?'on':''}" data-chip="${key}" data-multi="${multi?1:0}" data-v="Не знаю">Не знаю - посоветуйте</div>` : ''}</div>`;
}
function hints(key, list){
  return `<div class="hints"><small>Нажмите, чтобы добавить:</small>${list.map(v => `<button class="hint-chip" data-hint="${key}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
}
function sec(title, hint, body){ return `<div class="section"><h3>${title}</h3>${hint?`<p class="hint">${hint}</p>`:''}${body}</div>`; }

function mockHTML(m){
  const tt = m.up ? 'text-transform:uppercase;letter-spacing:.02em;' : '';
  const art = m.lay === 'bento'
    ? `<div class="img bento"><i style="background:${m.img};border-radius:${m.r}px"></i><i style="background:${m.ac};border-radius:${m.r}px"></i><i style="background:${m.img2||m.ac};border-radius:${m.r}px;opacity:.6"></i></div>`
    : `<div class="img" style="background:${m.img};border-radius:${m.lay==='full'?0:m.r}px;${m.bd&&m.up?'border:'+m.bd+';':''}"></div>`;
  return `<div class="mock ${m.lay||''}" style="background:${m.bg};color:${m.fg};font-family:'${m.font}',sans-serif;${m.bd&&m.up?'border:'+m.bd+';':''}">${art}
    <div class="nav"><b style="color:${m.ac}">LOGO</b><span><i>Услуги</i><i>Цены</i><i>Контакты</i></span></div>
    <div class="h" style="font-weight:${m.w};${tt}">Ваш сайт, который продаёт</div>
    <div class="s">Короткий подзаголовок про главную выгоду для клиента</div>
    <div class="b" style="background:${m.btn};color:${m.btnfg};border-radius:${m.r}px;${m.bd?'border:'+m.bd+';':''}${tt}">Оставить заявку</div>
  </div>`;
}

/* ---------- живое превью сайта из выбранных стиля, палитры и шрифта ---------- */
const rgb = h => { h = h.replace('#',''); if(h.length === 3) h = h.replace(/./g,'$&$&'); const n = parseInt(h.slice(0,6),16); return [n>>16&255, n>>8&255, n&255]; };
const lum = h => { const [r,g,b] = rgb(h); return (.299*r + .587*g + .114*b) / 255; };
const sat = h => { const c = rgb(h); return (Math.max(...c) - Math.min(...c)) / 255; };
const darkStyle = m => { const hex = (m.bg.match(/#[0-9a-f]{6}|#[0-9a-f]{3}\b/i)||['#fff'])[0]; return lum(hex) < .45; };
const ctaText = () => {
  const g = A.goals.join(' ');
  if(/Записывать/.test(g)) return 'Записаться';
  if(/Продавать товар/.test(g)) return 'Выбрать товар';
  if(/курс/.test(g)) return 'Записаться на курс';
  if(/событие/.test(g)) return 'Зарегистрироваться';
  if(/подписчиков/.test(g)) return 'Подписаться';
  if(/сотрудников/.test(g)) return 'Откликнуться';
  return 'Оставить заявку';
};
const cut = (t, n) => { t = String(t||'').trim().split('\n')[0]; return t.length > n ? t.slice(0, n-1).trim() + '…' : t; };
function sitePreview(styleId, palId, fontId, generic){
  const st = STYLES.find(x => x.id === styleId) || STYLES[0], m = st.m;
  const pal = PALETTES.find(x => x.id === palId), f = FONTS.find(x => x.id === fontId);
  let bg = m.bg, fg = m.fg, ac = m.ac, btn = m.btn, btnfg = m.btnfg, art = m.img, card = 'rgba(127,127,127,.12)', bd = m.bd || '';
  if(pal){
    const c = [...pal.c].sort((a,b) => lum(a) - lum(b));
    const mid = c.slice(1,4).sort((a,b) => sat(b) - sat(a))[0];
    const accent = sat(mid) > .25 ? mid : (sat(c[4]) > .25 ? c[4] : sat(c[0]) > .25 ? c[0] : mid);
    if(darkStyle(m)){ bg = c[0]; fg = c[4]; card = c[1]; ac = accent; btn = lum(accent) > .2 ? accent : c[4]; }
    else { bg = c[4]; fg = c[0]; card = c[3]; ac = accent; btn = lum(accent) < .75 ? accent : c[0]; }
    btnfg = lum(btn) > .6 ? c[0] : '#fff';
    art = `linear-gradient(135deg,${ac},${c[2]})`;
    bd = bd ? `1px solid ${ac}` : '';
    if(btn === 'transparent') btn = ac;
  }
  const fh = f ? f.h : m.font, fb = f ? f.b : m.font, hw = f ? f.hw : m.w, up = f ? f.up : m.up;
  const tt = up ? 'text-transform:uppercase;' : '';
  const lay = m.lay || '';
  const logo = esc(cut(A.company, 18) || 'LOGO');
  const title = esc(generic ? (A.company ? cut(A.company, 30) : 'Ваш сайт, который продаёт') : (cut(A.product, 60) || cut(A.company, 30) || 'Ваш сайт, который продаёт'));
  const sub = esc(generic ? 'Коротко о главной выгоде для клиента' : (cut(A.usp, 90) || 'Коротко о главной выгоде для клиента'));
  const nav = (A.blocks.length > 3 ? BLOCKS.filter(b => A.blocks.includes(b.id) && !b.must).slice(0,3).map(b => b.name.split(/[ /,]/)[0]) : ['Услуги','О нас','Контакты']).map(x => `<i>${esc(x)}</i>`).join('');
  const parts = (A.usp || '').split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
  const ben = (parts.length >= 2 && !generic ? parts : ['Опыт и гарантия','Быстро и удобно','Честные условия']).slice(0,3);
  const artHTML = lay === 'bento'
    ? `<div class="sp-art bento"><i style="background:${art};border-radius:${m.r}px"></i><i style="background:${ac};border-radius:${m.r}px"></i><i style="background:${card};border-radius:${m.r}px"></i></div>`
    : (lay === 'full' || lay === 'center') ? '' : `<div class="sp-art" style="background:${art};border-radius:${m.r}px"></div>`;
  return `<div class="sp ${lay}" style="background:${bg};color:${fg};font-family:'${fb}',sans-serif">
    <div class="sp-hero" style="${lay === 'full' ? 'background:'+art+';' : ''}">${artHTML}
      <div class="sp-nav"><b style="color:${lay==='full'?'#fff':ac};font-family:'${fh}'">${logo}</b><span>${nav}</span></div>
      <div class="sp-h" style="font-family:'${fh}',serif;font-weight:${hw};${tt}${title.length > 32 ? 'font-size:17px;' : ''}">${title}</div>
      <div class="sp-s">${sub}</div>
      <div class="sp-b" style="background:${btn};color:${btnfg};border-radius:${m.r}px;${bd?'border:'+bd+';':''}${tt}">${esc(ctaText())}</div>
    </div>
    <div class="sp-row">${ben.map(b => `<div style="background:${card};border-radius:${Math.min(m.r,16)}px"><i style="background:${ac}"></i><b>${esc(cut(b, 40))}</b></div>`).join('')}</div>
  </div>`;
}
const vcap = v => [(STYLES.find(x=>x.id===v.s)||{}).name, (PALETTES.find(x=>x.id===v.p)||{}).name, (FONTS.find(x=>x.id===v.f)||{}).name].filter(Boolean).join(' · ');
function variants(){
  const st = A.styles.length ? A.styles : A.liked.length ? A.liked : niche().styles.slice(0,2);
  const pl = A.palettes.length ? A.palettes : [null], ft = A.fonts.length ? A.fonts : [null];
  const n = Math.min(4, Math.max(st.length, pl.length, ft.length));
  return Array.from({length:n}, (_, i) => ({s:st[i % st.length], p:pl[i % pl.length], f:ft[i % ft.length]}));
}

}

/* ---------- ссылка на визуальный бриф: ответы сжаты прямо в адрес ---------- */
const b64u = bytes => { let s = ''; for(let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
async function briefLink(){
  const {deck, swipeIdx, ...data} = A;
  const raw = new TextEncoder().encode(JSON.stringify(data));
  let enc;
  try{ enc = 'z' + b64u(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); }
  catch(e){ enc = 'j' + b64u(raw); }
  return location.href.split('#')[0].split('?')[0] + '#brief=' + enc;
}
async function readBrief(){
  const enc = location.hash.slice(7), bytes = unb64u(enc.slice(1));
  const json = enc[0] === 'z' ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : new TextDecoder().decode(bytes);
  return JSON.parse(json);
}

/* ---------- автоотправка дизайнеру через Telegram-бота ---------- */
const hash = str => { let h = 0; for(let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return String(h); };
// отправлять нужно, если ответы изменились или появились новые файлы
const briefSig = () => hash(JSON.stringify(A));
const needSend = () => S.sentSig !== briefSig() || FILES.some(f => !f.sent);
function sendboxHTML(){
  if(!CONFIG.botToken || !CONFIG.chatId) return `<p>Отправьте ТЗ дизайнеру кнопками ниже.</p>`;
  if(SENDING) return `<p>⏳ Отправляем ТЗ дизайнеру…</p>`;
  if(!needSend()) return `<p><b>✅ ТЗ отправлено!</b> ${esc(CONFIG.designer)} скоро свяжется с вами${A.contact ? ': ' + esc(A.contact) : ''}.</p>`;
  return `${SEND_ERR ? '<p style="margin-bottom:8px">⚠️ Не получилось отправить - проверьте интернет и попробуйте ещё раз, или напишите в мессенджер ниже.</p>' : `<p><b>Последний шаг:</b> куда вам ответить?</p>`}
    <div class="field"><input data-k="contact" value="${esc(A.contact)}" placeholder="Телефон, Telegram или Instagram"></div>
    <button class="btn primary" data-send="bot">Отправить ТЗ дизайнеру</button>`;
}
const updateSendbox = () => { const el = $('#sendbox'); if(el){ el.innerHTML = sendboxHTML(); el.classList.toggle('ok', !needSend() && !SENDING); } };
async function botSend(){
  if(SENDING || !CONFIG.botToken || !CONFIG.chatId) return;
  const bad = checkContact(A.contact);
  if(bad){ toast(bad); $('#sendbox input')?.focus(); return; }
  SENDING = true; SEND_ERR = false; updateSendbox();
  const call = async (method, fields) => {
    const fd = new FormData(); fd.append('chat_id', CONFIG.chatId);
    for(const k in fields) Array.isArray(fields[k]) ? fd.append(k, ...fields[k]) : fd.append(k, fields[k]);
    const j = await (await fetch(`https://api.telegram.org/bot${CONFIG.botToken}/${method}`, {method:'POST', body:fd})).json();
    if(!j.ok) throw new Error(j.description);
  };
  try{
    const sig = briefSig();
    if(S.sentSig !== sig){
      const text = (S.sentSig ? '🔄 ОБНОВЛЁННОЕ ' : '🆕 ') + buildText();
      for(let i = 0; i < text.length; i += 4000) await call('sendMessage', {text: text.slice(i, i + 4000)});
      await call('sendMessage', {text: `<a href="${esc(await briefLink())}">🎨 Открыть визуальный бриф</a>`, parse_mode:'HTML', link_preview_options:'{"is_disabled":true}'});
      await call('sendDocument', {document: [new Blob([briefHTML()], {type:'text/html'}), fileName()]});
      S.sentSig = sig; save();
    }
    const fresh = FILES.filter(f => !f.sent);
    if(fresh.length) await call('sendMessage', {text: `📎 Файлы от ${A.name || 'клиента'}${A.company ? ' (' + A.company + ')' : ''}: ${fresh.length} шт.`});
    for(const f of fresh){ await call('sendDocument', {document: [f, f.name]}); f.sent = true; }
  }catch(e){ SEND_ERR = true; console.error(e); }
  SENDING = false; updateSendbox();
}

// короткое сообщение в бота; beacon - для момента, когда вкладку закрывают
function botMsg(text, beacon){
  if(VIEW || !CONFIG.botToken || !CONFIG.chatId) return;
  const url = `https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`;
  const fd = new FormData(); fd.append('chat_id', CONFIG.chatId); fd.append('text', text.slice(0, 4000));
  if(beacon && navigator.sendBeacon && navigator.sendBeacon(url, fd)) return;
  fetch(url, {method:'POST', body:fd, keepalive:true}).catch(() => {});
}
// Контакт: телефон, @ник или ссылка
function checkContact(v){
  const s = String(v || '').trim();
  if(!s) return 'Оставьте контакт, чтобы дизайнер смог ответить';
  const d = s.replace(/[\s()\-]/g, '');
  if(/^\+?\d{10,15}$/.test(d)) return /^(\+7|8|7)\d{10}$/.test(d) || /^\+\d{10,15}$/.test(d) ? '' : 'Похоже на телефон, но не хватает цифр. Пример: +7 900 123-45-67';
  if(/^@[A-Za-z0-9_.]{3,32}$/.test(s)) return '';
  if(/^@/.test(s)) return 'Ник пишется латиницей, от 3 символов: @shak.web';
  if(/^(https?:\/\/)?(www\.)?(t\.me|telegram\.me|instagram\.com|wa\.me|vk\.com)\/[A-Za-z0-9_.+]{2,}\/?(\?.*)?$/i.test(s)) return '';
  if(/^https?:\/\/[^\s.]+\.\S{2,}$/i.test(s)) return '';
  return 'Напишите телефон (+7 900 123-45-67), ник (@shak.web) или ссылку (t.me/ваш_ник)';
}
function start(){
  const bad = checkContact(A.contact);
  if(bad){
    const f = $('#wform'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    $('#wform [data-k="contact"]').focus(); toast(bad);
    return;
  }
  if(!S.startSent){
    S.startSent = true;
    botMsg(`👋 Новый клиент открыл анкету\n\nИмя: ${A.name || '-'}\nКонтакт: ${A.contact}${A.niches.length ? '\nСфера: ' + nicheName() : ''}`);
  }
  go(1);
}
// ушёл, не закончив: шлём то, что успел заполнить (не чаще раза в 3 минуты и только если что-то изменилось)
function sendPartial(){
  if(VIEW || !S.startSent || !A.contact.trim() || S.step === 0 || STEPS[S.step].id === 'result') return;
  const sig = briefSig();
  if(sig === S.partialSig || sig === S.sentSig || Date.now() - (S.partialAt || 0) < 180000) return;
  S.partialSig = sig; S.partialAt = Date.now(); save();
  botMsg(`⏸ НЕ ЗАКОНЧИЛ АНКЕТУ - остановился на шаге ${S.step} из ${STEPS.length - 1} («${STEPS[S.step].title}»)\n\n` + buildText(), true);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') sendPartial(); });
window.addEventListener('pagehide', sendPartial);

const fileName = () => `TZ-${(A.company||A.name||'site').replace(/[^\wа-яё-]+/gi,'_')}.html`;
function briefHTML(){
  const doc = $('.doc').outerHTML;
  const css = document.querySelector('style').textContent;
  const fonts = document.querySelector('link[href*="fonts.googleapis.com/css2"]').outerHTML;
  return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТЗ - ${esc(A.company||A.name||'сайт')}</title>${fonts}<style>${css}</style></head><body data-theme="light"><main><div class="wrap"><h1 style="letter-spacing:-.03em">ТЗ на сайт${A.company?' - '+esc(A.company):''}</h1><p style="color:#6b6b75">${esc(A.name)} · ${new Date().toLocaleDateString('ru-RU')}</p>${doc}<pre style="white-space:pre-wrap;font-size:12px;color:#888;margin-top:40px">${esc(buildText())}</pre></div></main></body></html>`;
}
function download(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([briefHTML()], {type:'text/html'}));
  a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();
}
async function send(kind){
  const t = buildText();
  if(kind === 'bot'){ botSend(); }
  else if(kind === 'copy'){ toast(await copyText(t) ? 'Текст ТЗ скопирован' : 'Не удалось скопировать'); }
  else if(kind === 'link'){ toast(await copyText(await briefLink()) ? 'Ссылка на бриф скопирована' : 'Не удалось скопировать'); }
  else if(kind === 'file'){ download(); toast('Файл ТЗ скачан - отправьте его дизайнеру'); }
  else if(kind === 'print'){ window.print(); }
  // Telegram сам подставляет текст в поле сообщения (?text=), копируем на всякий случай
  else if(kind === 'tg'){ await copyText(t); location.href = 'https://t.me/'+CONFIG.telegram+'?text='+encodeURIComponent(t); }
  // Instagram не принимает текст в ссылке - копируем и открываем директ
  else if(kind === 'ig'){ const ok = await copyText(t); toast(ok ? 'ТЗ скопировано - вставьте его в чат' : 'Скопируйте текст кнопкой ниже'); setTimeout(() => location.href = 'https://ig.me/m/'+CONFIG.instagram, 900); }
  else if(kind === 'wa'){ location.href = 'https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(t); }
  else if(kind === 'mail'){ location.href = 'mailto:'+CONFIG.email+'?subject='+encodeURIComponent('ТЗ на сайт'+(A.company?' - '+A.company:''))+'&body='+encodeURIComponent(t); }
}

/* =====================================================================
   ОТРИСОВКА И СОБЫТИЯ
   ===================================================================== */
function render(){
  const st = STEPS[S.step];
  clearInterval(STACK_T);
  $('#app').innerHTML = `<div class="${ANIM ? 'stage' : ''}">${R[st.id]()}</div>`;
  ANIM = false;
  if(JUST){ document.querySelector(JUST)?.classList.add('just'); JUST = null; }
  $('#bar').style.width = (S.step / (STEPS.length-1) * 100) + '%';
  $('#stepnum').innerHTML = S.step === 0 ? '' : `<b>${st.title}</b>${S.step} / ${STEPS.length-1}`;
  $('#peek').hidden = VIEW || !['style','colors','fonts','mood','structure','features','terms'].includes(st.id);
  if(st.id === 'welcome') bindStack();
  $('#prevBtn').style.visibility = S.step === 0 ? 'hidden' : 'visible';
  $('#nextBtn').style.display = (S.step === 0 || S.step === STEPS.length-1) ? 'none' : '';
  const swiping = st.id === 'taste' && A.swipeIdx < (A.deck.length || 1) && !VIEW;
  $('#bottom').classList.toggle('swiping', swiping);
  $('#prevBtn').textContent = swiping ? '←' : '← Назад';
  $('#nextBtn').textContent = swiping ? 'Пропустить' : S.step === STEPS.length-2 ? 'Собрать ТЗ ✓' : 'Дальше →';
  $('#note').textContent = S.step === STEPS.length-1 ? 'Можно вернуться и поменять ответы' : 'Ответы сохраняются автоматически · можно пропускать';
  $('#bottom').style.display = (S.step === 0 || VIEW) ? 'none' : '';
  if(VIEW){ $('.progress').style.visibility = 'hidden'; $('#stepnum').textContent = ''; }
  if(st.id === 'taste') bindSwipe();
  if(st.id === 'result' && !VIEW){ updateSendbox(); if(!checkContact(A.contact) && needSend() && !SEND_ERR) botSend(); }
  save();
}

/* свайп карточек пальцем или мышью */
function swipe(yes){
  const el = $('.swc.top'); if(!el) return;
  const id = el.dataset.id;
  (yes ? A.liked : A.disliked).push(id);
  if(yes && !A.styles.includes(id)) A.styles.push(id);
  A.swipeIdx++;
  el.style.transform = `translateX(${yes ? 700 : -700}px) rotate(${yes ? 25 : -25}deg)`;
  setTimeout(render, 230);
}
function bindSwipe(){
  const el = $('.swc.top'); if(!el) return;
  let x0 = null, dx = 0;
  const stamp = c => el.querySelector('.stamp.' + c);
  el.addEventListener('pointerdown', e => { el.classList.remove('teach'); $('.sw-hint')?.remove(); x0 = e.clientX; dx = 0; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if(x0 === null) return;
    dx = e.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    stamp('yes').style.opacity = Math.max(0, dx / 100); stamp('no').style.opacity = Math.max(0, -dx / 100);
  });
  const end = () => {
    if(x0 === null) return; x0 = null; el.classList.remove('drag');
    if(Math.abs(dx) > 90) swipe(dx > 0);
    else { el.style.transform = ''; stamp('yes').style.opacity = 0; stamp('no').style.opacity = 0; }
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function go(n){
  const was = S.step;
  S.step = Math.max(0, Math.min(STEPS.length-1, n)); ANIM = true; render(); window.scrollTo({top:0, behavior:'smooth'});
  if(STEPS[S.step].id === 'result' && was !== S.step) confetti();
}

/* стопка превью на первом экране: листается сама и по нажатию */
function bindStack(){
  const el = $('#stack'); if(!el) return;
  const cards = [...el.children]; let k = 0;
  const tick = () => { k++; cards.forEach((c, i) => c.dataset.pos = Math.min((i - k % cards.length + cards.length) % cards.length, 3)); };
  el.onclick = () => { tick(); clearInterval(STACK_T); if(!REDUCED) STACK_T = setInterval(tick, 3200); };
  if(!REDUCED) STACK_T = setInterval(tick, 3200);
}

/* окно «Ваш сайт сейчас» */
function drawPeek(){
  const v = variants(); PV = (PV + v.length) % v.length; const x = v[PV];
  let m = $('#modal');
  if(!m){ m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
  m.innerHTML = `<div class="box"><div class="mh"><b>Ваш сайт сейчас</b><button class="btn sm" data-peek="close" aria-label="Закрыть">✕</button></div>
    ${sitePreview(x.s, x.p, x.f)}
    <div class="nav2"><button class="btn sm" data-peek="prev" ${v.length < 2 ? 'disabled' : ''}>‹</button><small>${vcap(x)}${v.length > 1 ? ' · ' + (PV + 1) + ' из ' + v.length : ''}</small><button class="btn sm" data-peek="next" ${v.length < 2 ? 'disabled' : ''}>›</button></div>
    <p style="margin:12px 0 0;font-size:13px;color:var(--muted)">Превью меняется, когда вы выбираете стиль, цвета и шрифты.</p></div>`;
}
const closePeek = () => $('#modal')?.remove();
$('#peek').onclick = () => { PV = 0; drawPeek(); };

/* конфетти на финише */
function confetti(){
  if(REDUCED) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = devicePixelRatio || 1, W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr, ctx = c.getContext('2d');
  const cols = ['#6d5dfc','#b65cf0','#ff7a59','#ffd23f','#3bceac'];
  const ps = Array.from({length:140}, () => ({x:W/2, y:H*.35, vx:(Math.random()-.5)*16*dpr, vy:(Math.random()*-14-4)*dpr, r:(4+Math.random()*5)*dpr, c:cols[Math.random()*5|0], a:Math.random()*6, s:Math.random()*.3-.15}));
  let t = 0;
  (function f(){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .45*dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore(); });
    if(++t < 150) requestAnimationFrame(f); else c.remove();
  })();
}

/* лёгкий 3D-наклон карточек за курсором (только мышь) */
let TILT = null;
if(matchMedia('(pointer: fine)').matches && !REDUCED) document.addEventListener('pointermove', e => {
  const c = e.target.closest('.cards .card');
  if(TILT && TILT !== c) TILT.style.transform = '';
  TILT = c; if(!c) return;
  const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  c.style.transform = `perspective(900px) rotateY(${x * 7}deg) rotateX(${-y * 7}deg) translateY(-3px)`;
});

$('#prevBtn').onclick = () => go(S.step-1);
$('#nextBtn').onclick = () => go(S.step+1);
$('#brandSub').textContent = CONFIG.designer;

document.addEventListener('change', e => {
  if(e.target.id !== 'fileIn') return;
  const big = [];
  for(const f of e.target.files){ if(f.size > 20 * 1048576) big.push(f.name); else FILES.push(f); }
  if(big.length) toast('Слишком большие (больше 20 МБ): ' + big.join(', '));
  render();
});
document.addEventListener('input', e => {
  if(e.target.id === 'sample'){ SAMPLE = e.target.value; document.querySelectorAll('.fontprev .big').forEach(b => b.textContent = SAMPLE || A.company || 'Ваш бренд'); return; }
  const k = e.target.dataset.k; if(!k) return;
  A[k] = e.target.value; save();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.tagName === 'INPUT' && S.step === 0) start();
  if(e.key === 'Escape') closePeek();
});
document.addEventListener('click', e => {
  if(e.target.id === 'modal'){ closePeek(); return; }
  const t = e.target.closest('[data-more],[data-go],[data-start],[data-peek],[data-chip],[data-niche],[data-pick],[data-blk],[data-auto],[data-send],[data-swipe],[data-hint],[data-rmfile]');
  if(!t) return;
  const d = t.dataset;
  if(d.start){ start(); return; }
  if(d.more){ MORE[d.more] = true; render(); return; }
  if(d.peek){ if(d.peek === 'close') closePeek(); else { PV += d.peek === 'next' ? 1 : -1; drawPeek(); } return; }
  const q = v => `"${CSS.escape(v)}"`;
  if(d.chip) JUST = `[data-chip=${q(d.chip)}][data-v=${q(d.v)}]`;
  else if(d.pick) JUST = `[data-pick=${q(d.pick)}][data-v=${q(d.v)}]`;
  else if(d.blk) JUST = `[data-blk=${q(d.blk)}]`;
  else if(d.niche) JUST = `[data-niche=${q(d.niche)}]`;
  if(d.pick){ const pk = $('#peek'); pk.classList.remove('pulse'); void pk.offsetWidth; pk.classList.add('pulse'); }
  if(d.swipe){
    if(d.swipe === 'reset'){ A.deck = []; A.swipeIdx = 0; A.liked = []; A.disliked = []; render(); }
    else swipe(d.swipe === 'yes');
    return;
  }
  if(d.hint){
    const k = d.hint, cur = A[k].trim();
    if(!cur.includes(d.v)) A[k] = k === 'product' ? d.v : (cur ? cur.replace(/[\s,.;]+$/,'') + ', ' : '') + d.v;
    render(); return;
  }
  if(d.rmfile !== undefined){ FILES.splice(+d.rmfile, 1); render(); return; }
  if(d.go){ go(+d.go); return; }
  if(d.send){ send(d.send); return; }
  if(d.niche){ toggle(A.niches, d.niche); if(!A.swipeIdx) A.deck = []; render(); return; }
  if(d.chip){
    const k = d.chip, v = d.v;
    if(d.multi === '1'){
      if(v === 'Не знаю') A[k] = A[k].includes(v) ? [] : ['Не знаю'];
      else { A[k] = A[k].filter(x => x !== 'Не знаю'); toggle(A[k], v); }
    } else A[k] = A[k] === v ? '' : v;
    render(); return;
  }
  if(d.pick){
    toggle(A[d.pick], d.v);
    if(d.pick === 'styles') A.styleIdk = false;
    if(d.pick === 'palettes') A.palIdk = false;
    if(d.pick === 'fonts') A.fontIdk = false;
    render(); return;
  }
  if(d.blk){ toggle(A.blocks, d.blk); A.blocksIdk = false; render(); return; }
  if(d.auto){ AUTO[d.auto](); render(); toast('Подобрали варианты - можно поправить вручную'); }
});

// тема
(function(){
  let th = null; try{ th = localStorage.getItem('brief-theme'); }catch(e){}
  if(th) document.documentElement.dataset.theme = th;
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx;
    try{ localStorage.setItem('brief-theme', nx); }catch(e){}
  };
})();

if(VIEW){
  S.step = STEPS.findIndex(x => x.id === 'result');
  readBrief().then(data => { Object.assign(A, data); render(); })
    .catch(() => { $('#app').innerHTML = head('Ссылка повреждена', 'Не удалось открыть бриф - попросите прислать ссылку ещё раз.'); });
} else render();
</script>
