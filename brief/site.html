<title>Черновик вашего сайта · shak.web</title>

<meta name="description" content="Черновик сайта, собранный по ответам в брифе shak.web">
<style>
  /* Черновик сайта из брифа: цвета, шрифты и форма кнопок приходят из выбора человека */
  :root { --bg:#fff; --fg:#16181d; --ac:#5b4bff; --btn:#16181d; --btnfg:#fff; --card:#f1f1f4; --r:14px; --fh:system-ui; --fb:system-ui; --hw:700; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--fb), system-ui, sans-serif; overflow-x: clip; }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  .w { width: min(1120px, 100% - 32px); margin: 0 auto; }
  h1, h2, h3 { font-family: var(--fh), Georgia, serif; font-weight: var(--hw); margin: 0; line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
  .up h1, .up h2, .up .btn, .up .logo { text-transform: uppercase; }
  .muted { opacity: .72; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 24px; border-radius: var(--r); background: var(--btn); color: var(--btnfg); text-decoration: none; font-weight: 700; border: 0; font: 700 16px/1 var(--fb), sans-serif; cursor: pointer; }
  .btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }

  /* полоса черновика */
  .draft { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px max(16px, env(safe-area-inset-left)); background: #16181d; color: #fff; font: 600 13px/1.3 system-ui, sans-serif; }
  .draft b { font-weight: 800; }
  .draft .vs { display: flex; gap: 4px; margin-left: auto; }
  .draft .vs button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; font-weight: 700; cursor: pointer; }
  .draft .vs button.on { background: #fff; color: #16181d; }
  .draft a.want { background: #fff; color: #16181d; text-decoration: none; padding: 7px 12px; border-radius: 8px; white-space: nowrap; }
  .embed .draft { display: none; }
  @media (max-width: 480px) { .draft .t { display: none; } }

  /* шапка сайта */
  .top { display: flex; align-items: center; gap: 16px; padding: 18px 0; }
  .logo { font: var(--hw) 22px/1 var(--fh), serif; color: var(--ac); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .nav { display: flex; gap: 20px; margin-left: auto; font-size: 15px; }
  .nav a { text-decoration: none; opacity: .75; }
  .top .btn { min-height: 40px; padding: 0 16px; font-size: 14px; }
  @media (max-width: 760px) { .nav { display: none; } .top .btn { margin-left: auto; } }

  /* первый экран */
  .hero { position: relative; }
  .hero .in { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; padding: 26px 0 64px; }
  .hero h1 { font-size: clamp(36px, 6vw, 72px); }
  .hero p { font-size: 19px; margin: 18px 0 26px; max-width: 32em; }
  .hero .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .hero .ph { aspect-ratio: 4 / 5; border-radius: calc(var(--r) * 1.6); overflow: hidden; background: var(--art); position: relative; }
  .hero .ph img { width: 100%; height: 100%; object-fit: cover; animation: zoom 14s ease-out both; }
  .hero .badge { position: absolute; left: 16px; bottom: 16px; background: var(--bg); color: var(--fg); padding: 10px 14px; border-radius: var(--r); font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  @keyframes zoom { from { transform: scale(1.12); } to { transform: scale(1); } }
  .center .hero .in { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .center .hero p { margin-inline: auto; }
  .center .hero .acts { justify-content: center; }
  .center .hero .ph { aspect-ratio: 16 / 9; width: 100%; }
  .full .hero { color: #fff; min-height: 86vh; display: grid; align-items: end; }
  .full .hero .bgph { position: absolute; inset: 0; background: var(--art); overflow: hidden; }
  .full .hero .bgph img { width: 100%; height: 100%; object-fit: cover; animation: zoom 14s ease-out both; }
  .full .hero .bgph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.7)); }
  .full .hero .in { position: relative; grid-template-columns: 1fr; padding-bottom: 56px; }
  .full .hero .ph { display: none; }
  .full .top { color: #fff; position: relative; z-index: 2; }
  .full .logo { color: #fff; }
  @media (max-width: 860px) { .hero .in { grid-template-columns: 1fr; gap: 26px; padding-bottom: 46px; } .hero .ph { aspect-ratio: 4 / 3.4; } }

  .hero .t1, .hero .t2, .hero .acts { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .hero .t2 { animation-delay: .12s; } .hero .acts { animation-delay: .24s; }

  /* бегущая строка */

  .run span::after { content: "✦"; margin-left: 36px; opacity: .6; }

  .card { background: var(--card); border-radius: var(--r); padding: 22px; display: grid; gap: 8px; align-content: start; }
  section.alt .card { background: var(--bg); }
  .card .ic { width: 42px; height: 42px; border-radius: calc(var(--r) * .8); background: var(--ac); color: var(--btnfg); display: grid; place-items: center; font-weight: 800; }
  .card h3 { font-size: 21px; }
  .card p { margin: 0; }
  .svc { padding: 0; overflow: hidden; }
  .svc .im { aspect-ratio: 16 / 10; background: var(--art); overflow: hidden; }
  .svc .im img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .svc:hover .im img { transform: scale(1.05); }
  .svc .bd { padding: 18px 20px 22px; display: grid; gap: 6px; }
  .price { font: var(--hw) 22px/1 var(--fh), serif; color: var(--ac); margin-top: 6px; }
  .steps { counter-reset: s; }
  .steps .card::before { counter-increment: s; content: counter(s); width: 42px; height: 42px; border-radius: 50%; background: var(--ac); color: var(--btnfg); display: grid; place-items: center; font-weight: 800; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; text-align: center; }
  .nums b { display: block; font: var(--hw) clamp(40px, 7vw, 72px)/1 var(--fh), serif; color: var(--ac); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .split .ph { aspect-ratio: 4 / 3.4; border-radius: calc(var(--r) * 1.4); overflow: hidden; background: var(--art); }
  .split .ph img { width: 100%; height: 100%; object-fit: cover; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; gap: 24px; } }
  .gal { display: grid; grid-template-columns: 1.3fr 1fr 1fr; grid-auto-rows: 200px; gap: 12px; }
  .gal div { border-radius: var(--r); overflow: hidden; background: var(--art); }
  .gal div:first-child { grid-row: span 2; }
  .gal img { width: 100%; height: 100%; object-fit: cover; }
  @media (max-width: 760px) { .gal { grid-template-columns: 1fr 1fr; grid-auto-rows: 150px; } }
  .rev .card { border-left: 4px solid var(--ac); }
  .rev small { opacity: .6; }
  .faq details { background: var(--card); border-radius: var(--r); margin-bottom: 10px; }
  .faq summary { padding: 18px 20px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  .faq summary::after { content: "+"; color: var(--ac); font-size: 22px; line-height: 1; }
  .faq details[open] summary::after { content: "−"; }
  .faq p { margin: 0; padding: 0 20px 18px; }
  .promo { background: var(--ac); color: var(--btnfg); border-radius: calc(var(--r) * 1.6); padding: 40px; display: grid; gap: 14px; }
  .promo .btn { background: var(--btnfg); color: var(--ac); justify-self: start; }
  .final { background: var(--fg); color: var(--bg); }
  .final .split .card { background: color-mix(in srgb, var(--bg) 8%, transparent); }
  .form { display: grid; gap: 10px; }
  .form input { font: inherit; padding: 14px 16px; border-radius: var(--r); border: 1.5px solid color-mix(in srgb, var(--bg) 30%, transparent); background: transparent; color: inherit; }
  .form .btn { background: var(--ac); color: var(--btnfg); }
  footer { padding: 26px 0 40px; font-size: 14px; opacity: .7; }
  .note { font-size: 13px; opacity: .6; margin-top: 10px; }

  [data-r] { transition: opacity .8s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .js [data-r]:not(.in) { opacity: 0; transform: translateY(34px); }
  @media (prefers-reduced-motion: reduce) { .js [data-r]:not(.in) { opacity: 1; transform: none; } .run div, .hero img, .hero .t1, .hero .t2, .hero .acts { animation: none; } }
</style>
