<!doctype html>
<html lang="ru" data-fonts="Viaoda Libre|Arsenal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  <title>Мастерская</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Arsenal:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    /* Тема «Нить»: сайт как сцена. Бархатный занавес открывает работы, вещи висят на шнуре и качаются, от касания летят пайетки */
    :root { --main: #7A1E36; --accent: #D9B45A; --bg: #F3EAE6; --text: #23161A; --velvet: #4A1022; --velvet2: #2B0913; --cord: #A97B4F; --paper: #FBF7F5; --c-radius: 14px; --ease: cubic-bezier(.2, .8, .2, 1); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3 { font-family: var(--font-head); font-weight: 400; margin: 0; letter-spacing: -.01em; }
    .wrap { width: min(1120px, 100% - 32px); margin: 0 auto; }

    /* Шапка из матового стекла поверх сцены */
    .top { position: sticky; top: 10px; z-index: 40; margin: 10px 0 -72px; }
    .top .wrap { display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 18px; border-radius: 999px; color: #fff; background: rgba(43,9,19,.28); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); transition: background .4s, color .4s; }
    .top.light .wrap { color: var(--text); background: rgba(251,247,245,.72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 30px -18px rgba(35,22,26,.4); }
    .logo { margin-right: auto; min-width: 0; text-decoration: none; font: 400 22px/1 var(--font-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logo small { font: 400 13px var(--font-body); opacity: .7; margin-left: 6px; }
    .cart { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 9px 9px 9px 16px; background: var(--accent); color: var(--text); font: 700 14px var(--font-body); cursor: pointer; white-space: nowrap; }
    .cart b { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: rgba(35,22,26,.14); display: grid; place-items: center; font-size: 12px; }
    .cart b.has { background: var(--velvet); color: #fff; animation: bump .5s cubic-bezier(.3,1.6,.5,1); }
    @keyframes bump { 40% { transform: scale(1.35); } }

    /* Сцена: работа в луче прожектора, бархатный занавес разъезжается */
    .stage { position: relative; min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 96px 0 40px; overflow: hidden; color: #fff; background: radial-gradient(70% 50% at 50% 30%, var(--velvet), var(--velvet2) 75%); isolation: isolate; }
    /* Низ сцены: бархат плавно перетекает в светлый фон */
    .hem { height: 140px; margin-top: -1px; background: linear-gradient(180deg, var(--velvet2) 0%, color-mix(in srgb, var(--velvet2) 55%, var(--bg)) 38%, color-mix(in srgb, var(--velvet2) 18%, var(--bg)) 72%, var(--bg) 100%); }
    .pause { margin: 0 16px; padding: 12px 16px; border-radius: 14px; background: var(--accent); color: var(--text); font: 700 15px/1.35 var(--font-body); text-align: center; }
    .arch { position: relative; z-index: 1; width: min(76%, 400px); aspect-ratio: 4 / 5; border-radius: 999px 999px 10px 10px; overflow: hidden; box-shadow: 0 0 0 6px rgba(217,180,90,.18), 0 40px 80px -20px rgba(0,0,0,.7); }
    .arch::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px rgba(217,180,90,.7); }
    .shot { width: 100%; height: 100%; object-fit: cover; transform: scale(1.18); animation: settle 3.4s .6s var(--ease) forwards; }
    @keyframes settle { to { transform: none; } }
        .stage::after { content: ""; position: absolute; left: 50%; top: -10%; width: 140%; height: 80%; z-index: -1; transform: translateX(-50%); background: conic-gradient(from 180deg at 50% 0, transparent 160deg, rgba(255,236,190,.16) 172deg, rgba(255,236,190,.24) 180deg, rgba(255,236,190,.16) 188deg, transparent 200deg); opacity: 0; animation: beam 2.2s 1.2s ease forwards; mix-blend-mode: screen; }
    @keyframes beam { to { opacity: 1; } }
    .cur { position: absolute; top: 0; bottom: 0; width: 52%; z-index: 3; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%, rgba(0,0,0,.35)), repeating-linear-gradient(90deg, color-mix(in srgb, var(--velvet) 80%, #fff 0%) 0, color-mix(in srgb, var(--velvet) 82%, #fff) 14px, var(--velvet) 30px, var(--velvet2) 38px, var(--velvet) 46px); box-shadow: inset 0 -40px 60px rgba(0,0,0,.45); }
    .cur.l { left: 0; transform-origin: left center; animation: openL 2.1s .35s cubic-bezier(.7,0,.2,1) forwards; }
    .cur.r { right: 0; transform-origin: right center; animation: openR 2.1s .35s cubic-bezier(.7,0,.2,1) forwards; }
    @keyframes openL { to { transform: translateX(-88%) scaleX(.55); } }
    @keyframes openR { to { transform: translateX(88%) scaleX(.55); } }
    .valance { position: absolute; left: 0; right: 0; top: 0; height: 40px; z-index: 4; pointer-events: none; background: linear-gradient(180deg, var(--velvet2), var(--velvet)); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
    .valance::after { content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; background: repeating-linear-gradient(90deg, var(--accent) 0 2px, transparent 2px 5px); -webkit-mask: linear-gradient(#000, transparent); mask: linear-gradient(#000, transparent); }
    .sparks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .lead { position: relative; z-index: 5; width: 100%; margin-top: 22px; text-align: center; }
    .lead small { display: block; font: 400 15px var(--font-body); letter-spacing: .02em; color: var(--accent); margin-bottom: 10px; opacity: 0; animation: up 1s 1.9s var(--ease) forwards; }
    .lead h1 { font-size: clamp(42px, 12.4vw, 104px); line-height: .98; max-width: 13ch; margin: 0 auto; }
    .lead h1 span { display: inline-block; opacity: 0; transform: translateY(.4em); filter: blur(6px); animation: letter .9s var(--ease) forwards;
      background: linear-gradient(100deg, #fff 40%, #F6E3A8 50%, #fff 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
    @keyframes letter { to { opacity: 1; transform: none; filter: none; } }
    .lead h1.shine span { animation: letter .9s var(--ease) forwards, shine 2.6s 0s ease-in-out; }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
    .lead p { margin: 14px auto 22px; max-width: 32ch; color: rgba(255,255,255,.82); opacity: 0; animation: up 1s 2.4s var(--ease) forwards; }
    .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; opacity: 0; animation: up 1s 2.6s var(--ease) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 24px; border-radius: 999px; border: 0; background: var(--accent); color: var(--text); font: 700 16px var(--font-body); text-decoration: none; cursor: pointer; white-space: nowrap; transition: transform .25s var(--ease); }
    .btn:active { transform: scale(.96); }
    .btn.line { background: rgba(255,255,255,.08); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .btn.dark { background: var(--velvet); color: #fff; }

    /* Заголовок раздела висит на шнуре с узлом */
    .sec { padding: 64px 0 8px; }
    .hem + .sec { padding-top: 8px; }
    .sec h2 { font-size: clamp(36px, 9vw, 64px); line-height: 1; display: flex; align-items: flex-start; gap: 14px; }
    .sec h2::before { content: ""; flex: 0 0 12px; height: 1.05em; margin-top: -.5em; background: linear-gradient(var(--cord), var(--cord)) center top / 2px calc(100% - 12px) no-repeat, radial-gradient(circle, var(--cord) 5px, transparent 5.5px) center bottom / 12px 12px no-repeat; }
    .sec .sub { margin: 10px 0 18px 26px; max-width: 44ch; color: color-mix(in srgb, var(--text) 68%, transparent); }
    .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex-shrink: 0; border: 0; border-radius: 999px; padding: 9px 16px; background: var(--paper); color: var(--text); font: 700 14px var(--font-body); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(35,22,26,.12); }
    .tabs button.on { background: var(--velvet); color: #fff; box-shadow: none; }

    /* Вешалка: шнур через весь ряд, вещи висят на нитках и качаются, когда листаешь */
    .rack { position: relative; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 0 24px; margin-top: 18px; }
    .rack::-webkit-scrollbar { display: none; }
    .hanger { position: relative; display: flex; gap: 14px; width: max-content; padding: 30px 16px 0; }
    .hanger::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: var(--cord); border-radius: 2px; box-shadow: 0 1px 0 rgba(255,255,255,.5); }
    .card { width: min(68vw, 270px); flex-shrink: 0; scroll-snap-align: center; transform-origin: 50% -16px; transform: rotate(var(--a, 0deg)); will-change: transform; }
    .card[hidden] { display: none; }
    .card::before { content: ""; position: absolute; left: 50%; top: -16px; width: 2px; height: 16px; margin-left: -1px; background: var(--cord); }
    .card::after { content: ""; position: absolute; left: 50%; top: -21px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--cord); box-shadow: inset -2px -2px 0 rgba(0,0,0,.18); }
    .card { position: relative; }
    .ph { position: relative; aspect-ratio: 4 / 5; background: #D9CFCB;
      --fr: linear-gradient(#000 0 0) top / 100% calc(100% - 22px) no-repeat,
            repeating-linear-gradient(90deg, #000 0 1.6px, transparent 1.6px 5px) left bottom / 100% 22px no-repeat,
            repeating-linear-gradient(90deg, transparent 0 2.6px, #000 2.6px 4.2px, transparent 4.2px 5px) left bottom 8px / 100% 14px no-repeat;
      -webkit-mask: var(--fr); mask: var(--fr); }
    .ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px 8px 0 0; }
    .tag { position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: 999px; background: var(--accent); color: var(--text); font: 700 12px var(--font-body); }
    .card h3 { font-size: 25px; line-height: 1.08; margin: 12px 0 4px; }
    .card p { margin: 0 0 12px; font-size: 15px; line-height: 1.4; color: color-mix(in srgb, var(--text) 66%, transparent); }
    .buy { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .price { font: 700 17px var(--font-body); white-space: nowrap; }
    .add { border: 0; border-radius: 999px; padding: 9px 16px; background: var(--velvet); color: #fff; font: 700 14px var(--font-body); cursor: pointer; white-space: nowrap; transition: background .2s; }
    .add.done { background: var(--accent); color: var(--text); }
    .card.sold .ph img { filter: grayscale(.5) brightness(.85); }
    .card.sold .tag { background: var(--text); color: #fff; }
    .hint { margin: 0 16px; font-size: 14px; color: color-mix(in srgb, var(--text) 55%, transparent); }
    .ask { margin-top: 26px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 22px; border-radius: 16px; background: var(--paper); }
    .ask p { margin: 0; max-width: 40ch; }

    /* Раскрытие фото при прокрутке: шторка уходит вверх */
    [data-reveal] { clip-path: inset(0 0 100% 0); transition: clip-path 1.4s cubic-bezier(.7,0,.2,1); }
    [data-reveal].in { clip-path: inset(0 0 0 0); }
    [data-reveal] img { transform: scale(1.15); transition: transform 1.8s var(--ease); }
    [data-reveal].in img { transform: none; }

    .worn { display: grid; gap: 20px; margin-top: 22px; align-items: end; }
    .worn .pic { border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 5; }
    .worn .pic img { width: 100%; height: 100%; object-fit: cover; }
    .worn blockquote { margin: 0; font: 400 clamp(28px, 7vw, 44px)/1.12 var(--font-head); }
    .worn figcaption { margin-top: 12px; font-size: 15px; color: color-mix(in srgb, var(--text) 66%, transparent); }
    @media (min-width: 800px) { .worn { grid-template-columns: 1fr 1fr; gap: 56px; } }

    .how { display: grid; gap: 30px; }
    .how .pic { border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 5; }
    .how .pic img { width: 100%; height: 100%; object-fit: cover; }
    .steps { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; display: grid; gap: 26px; counter-reset: s; }
    .steps::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--cord); transform-origin: top; transform: scaleY(0); transition: transform 1.6s var(--ease); }
    .steps.in::before { transform: none; }
    .steps li { position: relative; counter-increment: s; opacity: 0; transform: translateX(-8px); transition: opacity .6s, transform .6s var(--ease); }
    .steps.in li { opacity: 1; transform: none; }
    .steps.in li:nth-child(2) { transition-delay: .3s; } .steps.in li:nth-child(3) { transition-delay: .6s; } .steps.in li:nth-child(4) { transition-delay: .9s; }
    .steps li::before { content: counter(s); position: absolute; left: -33px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px var(--cord); display: grid; place-items: center; font: 700 13px var(--font-body); color: var(--main); }
    .steps strong { display: block; font: 400 25px/1.15 var(--font-head); margin-bottom: 4px; }
    .steps span { color: color-mix(in srgb, var(--text) 70%, transparent); }
    @media (min-width: 800px) { .how { grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; } }

    /* Обо мне: бархатный блок с блёстками */
    .me { position: relative; margin-top: 40px; color: #fff; padding: 180px 0 40px; background: linear-gradient(180deg, var(--bg) 0, color-mix(in srgb, var(--velvet2) 18%, var(--bg)) 40px, color-mix(in srgb, var(--velvet2) 55%, var(--bg)) 90px, var(--velvet2) 150px); overflow: hidden; }
    .me .in { position: relative; display: grid; gap: 26px; }
    .me .pic { border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 5; }
    .me .pic img { width: 100%; height: 100%; object-fit: cover; }
    .me h2 { font-size: clamp(40px, 10vw, 68px); line-height: 1; }
    .me p { margin: 14px 0 22px; max-width: 46ch; color: rgba(255,255,255,.8); }
    .rows { display: grid; margin-top: 26px; }
    .rows a, .rows div { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid rgba(255,255,255,.14); text-decoration: none; min-width: 0; }
    .rows small { color: rgba(255,255,255,.6); font-size: 14px; }
    .rows strong { font-weight: 700; overflow-wrap: anywhere; text-align: right; color: var(--accent); }
    @media (min-width: 800px) { .me .in { grid-template-columns: .8fr 1.2fr; gap: 56px; align-items: center; } }
    footer { background: var(--velvet2); color: rgba(255,255,255,.5); padding: 0 0 28px; font-size: 13px; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; border-top: 1px solid rgba(255,255,255,.1); padding-top: 18px; }

    /* Пайетки от касания */
    .seq { position: fixed; z-index: 70; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 35% 35%, #fff 0 18%, var(--c, #D9B45A) 40%, #8A6A22 100%); animation: fly .9s cubic-bezier(.2,.7,.4,1) forwards; }
    @keyframes fly { to { transform: translate(var(--x), var(--y)) scale(.4); opacity: 0; } }

    .c-drawer { --c-surface: var(--paper); }
    .c-send { background: var(--velvet) !important; }
    @media (prefers-reduced-motion: reduce) {
      .cur { display: none; } .lead h1 span, .lead small, .lead p, .acts { opacity: 1; transform: none; filter: none; }
      [data-reveal] { clip-path: none; } .steps li { opacity: 1; transform: none; } .steps::before { transform: none; }
    }
  </style>
  <script src="data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/core.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
  (function () {
    var D = Core.data, e = Core.esc, X = Core.x;
    var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var hp = D.hero.photo || (D.items[0] && D.items[0].photo) || "";
    var tgUser = String(D.contacts.telegram || "").replace(/^@/, "");
    var write = function (t) { return tgUser ? Core.tg(t) : "#contacts"; };
    var F = (X.filters || []).map(function (f) { return { label: f[0], re: new RegExp(f[1], "i") }; });
    function kind(i) { if (i.group != null && i.group !== "") return +i.group; for (var k = 0; k < F.length; k++) if (F[k].re.test(i.name + " " + i.desc + " " + i.tag)) return k; return -1; }
    var pre = X.pricePrefix ? e(X.pricePrefix) + " " : "";

    // Заголовок по буквам: каждая проявляется из блеска, слова не рвутся
    var n = 0;
    var h1 = D.hero.title.split(" ").map(function (w) {
      return '<i style="font-style:normal;white-space:nowrap">' + w.split("").map(function (ch) { return '<span style="animation-delay:' + (1.3 + (n++) * .045).toFixed(2) + 's">' + e(ch) + '</span>'; }).join("") + '</i>';
    }).join(" ");

    var ST = { stock: "В наличии", sold: "Продано" };
    var shown = D.items.filter(function (i) { return !i.hidden; });
    var cards = shown.map(function (i) {
      var tag = ST[i.status] || i.tag;
      return '<article class="card' + (i.status === "sold" ? ' sold' : '') + '" data-kind="' + kind(i) + '"><div class="ph">' + Core.pic(i) + (tag ? '<span class="tag">' + e(tag) + '</span>' : '') + '</div>' +
        '<h3>' + e(i.name) + '</h3>' + (i.desc ? '<p>' + e(i.desc) + '</p>' : '') +
        '<div class="buy"><span class="price">' + pre + Core.money(i.price) + '</span>' + (i.status === "sold" ? '<a class="add" href="' + e(write("Здравствуйте, Ирина! Можно повторить «" + i.name + "»?")) + '" target="_blank" rel="noopener" style="text-decoration:none">Повторить</a>' : '<button class="add" data-add="' + e(i.id) + '">' + e(D.sections.addLabel || "В заказ") + '</button>') + '</div></article>';
    }).join("");
    var steps = D.features.map(function (f) { return '<li><strong>' + e(f.title) + '</strong><span>' + e(f.text) + '</span></li>'; }).join("");
    var rows = Core.contacts().map(function (r) {
      var inner = '<small>' + e(r[0]) + '</small><strong>' + e(r[1]) + '</strong>';
      return r[2] ? '<a href="' + e(r[2]) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div>' + inner + '</div>';
    }).join("") + (X.tiktok ? '<a href="https://www.tiktok.com/@' + e(X.tiktok) + '" target="_blank" rel="noopener"><small>TikTok</small><strong>@' + e(X.tiktok) + '</strong></a>' : '');
    var pic = function (src) { return src ? '<div class="pic" data-reveal><img src="' + e(src) + '" alt="" loading="lazy"></div>' : ''; };

    Core.mount(
      '<header class="top"><div class="wrap"><a class="logo" href="#top">' + e(D.brand.name) + (D.brand.tagline ? '<small>' + e(D.brand.tagline) + '</small>' : '') + '</a>' +
        '<button class="cart" data-open-cart>' + e(D.sections.cartLabel || "Заказ") + '<b data-count>0</b></button></div></header>' +
      '<main id="top">' +
      '<section class="stage">' + (hp ? '<div class="arch"><img class="shot" src="' + e(hp) + '" alt="' + e(X.heroAlt || "") + '"></div>' : '') +
        '<canvas class="sparks" aria-hidden="true"></canvas><div class="valance" aria-hidden="true"></div><div class="cur l" aria-hidden="true"></div><div class="cur r" aria-hidden="true"></div>' +
        '<div class="lead"><div class="wrap"><small>' + e(X.heroNote || D.brand.tagline || "") + '</small><h1>' + h1 + '</h1><p>' + e(D.hero.text) + '</p><div class="acts"><a class="btn" href="#shop">' + e(D.hero.cta) + '</a>' +
        (tgUser ? '<a class="btn line" href="' + e(write(X.askMsg || "Здравствуйте! Хочу заказать изделие")) + '" target="_blank" rel="noopener">Написать в Telegram</a>' : '') + '</div></div></div></section><div class="hem" aria-hidden="true"></div>' +
      (X.pause && X.pause.on ? '<div class="sec" style="padding-top:28px"><p class="pause">' + e(X.pause.text || "Сейчас перерыв в заказах") + '</p></div>' : '') +

      '<section class="sec" id="shop"><div class="wrap"><h2>' + e(D.sections.catalogTitle) + '</h2><p class="sub">' + e(D.sections.catalogText) + '</p>' +
        (F.length ? '<div class="tabs" role="group" aria-label="Что показать"><button class="on" data-f="all">Все</button>' + F.map(function (f, k) { return shown.some(function (i) { return kind(i) === k; }) ? '<button data-f="' + k + '">' + e(f.label) + '</button>' : ''; }).join("") + '</div>' : '') +
        '</div><div class="rack"><div class="hanger">' + cards + '</div></div><p class="hint wrap">' + e(X.swipeHint || "Листайте вбок: все вещи висят на одной вешалке") + '</p>' +
        (tgUser ? '<div class="wrap"><div class="ask"><p>' + e(X.askTitle || "Хотите своё? Пришлите фото или эскиз, сплету по вашим меркам.") + '</p><a class="btn dark" href="' + e(write(X.askIdea || "Здравствуйте! Хочу изделие по своей идее")) + '" target="_blank" rel="noopener">Обсудить идею</a></div></div>' : '') +
      '</section>' +

      (X.client ? '<section class="sec"><div class="wrap"><h2>' + e(X.clientTitle || "Носят клиентки") + '</h2><figure class="worn" style="margin:22px 0 0">' + pic(X.client) + '<div><blockquote>' + e(X.clientQuote || "") + '</blockquote><figcaption>' + e(X.clientNote || "") + '</figcaption></div></figure></div></section>' : '') +

      '<section class="sec"><div class="wrap how"><div><h2>' + e(X.howTitle || "Как заказать") + '</h2><p class="sub">' + e(X.howText || "") + (X.queue ? ' <b>Сейчас очередь: ' + e(X.queue) + '.</b>' : '') + '</p><ol class="steps" data-steps>' + steps + '</ol></div>' + pic(X.hands) + '</div></section>' +
      '</main>' +

      '<section class="me" id="contacts"><canvas class="sparks" aria-hidden="true"></canvas><div class="wrap in">' + pic(X.about) +
        '<div><h2>' + e(D.sections.aboutTitle) + '</h2><p>' + e(D.sections.aboutText) + '</p>' +
        (tgUser ? '<a class="btn" href="' + e(write(X.askMsg || "Здравствуйте! Хочу заказать изделие")) + '" target="_blank" rel="noopener">Написать в Telegram</a>' : '') +
        '<div class="rows">' + rows + '</div></div></div></section>' +
      '<footer><div class="wrap"><span>© ' + new Date().getFullYear() + ' ' + e(D.brand.name) + (D.credits ? '. ' + e(D.credits) : '') + '</span><span><a href="admin.html">Вход для владельца</a>. Сайт сделан в <a href="https://instagram.com/shak.web" target="_blank" rel="noopener">shak.web</a></span></div></footer>'
    );

    // Блеск пробегает по заголовку, когда буквы проявились
    setTimeout(function () { var h = document.querySelector(".lead h1"); if (h) h.classList.add("shine"); }, 2600);

    // Шапка светлеет, когда сцена ушла вверх
    var top = document.querySelector(".top"), stage = document.querySelector(".stage");
    function onScroll() { top.classList.toggle("light", stage.getBoundingClientRect().bottom < 80); }
    addEventListener("scroll", onScroll, { passive: true }); onScroll();

    // Блёстки на бархате: мерцающие четырёхлучевые звёздочки
    [].forEach.call(document.querySelectorAll("canvas.sparks"), function (cv) {
      if (calm) return;
      var ctx = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2), W, H, P = [], on = false;
      function size() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      size(); addEventListener("resize", size);
      for (var k = 0; k < 46; k++) P.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.6, s: .3 + Math.random() * .9, p: Math.random() * 6.3, v: .02 + Math.random() * .05, g: Math.random() < .7 });
      function star(x, y, r, a, gold) {
        ctx.globalAlpha = a; ctx.fillStyle = gold ? "#F3D88C" : "#ffffff";
        ctx.beginPath(); ctx.moveTo(x, y - r * 3); ctx.quadraticCurveTo(x, y, x + r * 3, y); ctx.quadraticCurveTo(x, y, x, y + r * 3); ctx.quadraticCurveTo(x, y, x - r * 3, y); ctx.quadraticCurveTo(x, y, x, y - r * 3); ctx.fill();
      }
      function frame(t) {
        if (!on) return;
        ctx.clearRect(0, 0, W, H);
        P.forEach(function (q) { q.y -= q.v / H * 6; if (q.y < -.02) q.y = 1.02; var a = Math.max(0, Math.sin(t / 1000 * q.s * 2 + q.p)); star(q.x * W, q.y * H, q.r * (.5 + a * .6), a * .9, q.g); });
        requestAnimationFrame(frame);
      }
      new IntersectionObserver(function (es) { var was = on; on = es[0].isIntersecting; if (on && !was) requestAnimationFrame(frame); }).observe(cv);
    });

    // Вешалка качается: скорость прокрутки толкает вещи, пружина возвращает
    var rack = document.querySelector(".rack"), last = rack.scrollLeft, cards = [].slice.call(document.querySelectorAll(".card"));
    var st = cards.map(function (c, k) { return { a: 0, v: 0, m: .8 + (k % 3) * .15 }; }), push = 0, running = false;
    function swing() {
      running = false;
      var moving = false;
      st.forEach(function (s, k) {
        s.v += (-s.a * .06) + push * s.m; s.v *= .9; s.a += s.v;
        if (Math.abs(s.a) > .02 || Math.abs(s.v) > .02) moving = true;
        cards[k].style.setProperty("--a", Math.max(-5, Math.min(5, s.a)).toFixed(2) + "deg");
      });
      push = 0;
      if (moving) { running = true; requestAnimationFrame(swing); }
    }
    function kick(f) { if (calm) return; push += f; if (!running) { running = true; requestAnimationFrame(swing); } }
    rack.addEventListener("scroll", function () { var d = rack.scrollLeft - last; last = rack.scrollLeft; kick(Math.max(-.5, Math.min(.5, -d * .02))); }, { passive: true });
    // Когда вешалка появляется на экране, её качает лёгким ветром
    new IntersectionObserver(function (es, o) { if (es[0].isIntersecting) { kick(.7); setTimeout(function () { kick(-.4); }, 260); o.disconnect(); } }, { threshold: .4 }).observe(rack);
    document.addEventListener("core:add", function (ev) { var c = ev.detail.el.closest(".card"); var k = cards.indexOf(c); if (k >= 0 && !calm) { st[k].v += .9; kick(0); } });

    // Шаги заказа проявляются по шнуру
    new IntersectionObserver(function (es, o) { es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); o.unobserve(en.target); } }); }, { threshold: .3 }).observe(document.querySelector("[data-steps]"));

    // Пайетки разлетаются от касания
    if (!calm) document.addEventListener("pointerdown", function (ev) {
      var cols = ["#D9B45A", "#E9D9A6", "#C0C4CC", "#7A1E36"];
      for (var k = 0; k < 9; k++) {
        var s = document.createElement("i"); s.className = "seq";
        var ang = Math.random() * 6.28, dist = 40 + Math.random() * 60;
        s.style.left = ev.clientX + "px"; s.style.top = ev.clientY + "px";
        s.style.setProperty("--x", (Math.cos(ang) * dist).toFixed(0) + "px"); s.style.setProperty("--y", (Math.sin(ang) * dist + 40).toFixed(0) + "px");
        s.style.setProperty("--c", cols[k % cols.length]);
        document.body.appendChild(s); setTimeout(s.remove.bind(s), 950);
      }
    }, { passive: true });

    document.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-f]"); if (!b) return;
      [].forEach.call(document.querySelectorAll("[data-f]"), function (x) { x.classList.toggle("on", x === b); });
      cards.forEach(function (c) { c.hidden = b.dataset.f !== "all" && c.dataset.kind !== b.dataset.f; });
      rack.scrollTo({ left: 0, behavior: "smooth" }); kick(.6);
    });
  })();
  </script>
</body>
</html>
