<!doctype html>
<html lang="ru" data-fonts="Geologica|Golos Text">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <title>Галант | Кофейня</title>
  <meta name="description" content="Галант, Курск. Рафы, латте и матча по нашим рецептам, а к ним кондитерские изделия. Закажите заранее и заберите без очереди.">
  <meta property="og:title" content="Галант">
  <meta property="og:description" content="Рафы, латте и матча по нашим рецептам, а к ним кондитерские изделия. Закажите заранее и заберите без очереди.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@200;300;500&family=Golos+Text:wght@400;500;600&display=swap">
  <style>
    /* «Кино»: страница ведётся прокруткой. Фото из рамки растёт на весь экран, позиции раскладываются веером */
    :root { --bg: #EDE6DA; --text: #1C1410; --main: #1F5C4A; --milk: #F7F2EA; --c-radius: 18px; --c-surface: var(--milk); --ease: cubic-bezier(.2, .8, .2, 1); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3 { font-family: var(--font-head); font-weight: 200; margin: 0; letter-spacing: -.045em; }
    .wrap { width: min(1200px, 100% - 32px); margin: 0 auto; }

    .top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; transition: background .4s, color .4s; }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .top.solid { background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .top.on-photo:not(.solid) { color: #fff; }
    .logo { font: 500 18px/1 var(--font-head); letter-spacing: -.02em; text-decoration: none; }
    .cart { display: inline-flex; align-items: center; gap: 8px; border: 1px solid currentColor; background: none; color: inherit; border-radius: 999px; padding: 8px 14px; font: 500 14px var(--font-body); cursor: pointer; }
    .cart b { min-width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; background: currentColor; }
    .cart b span { color: var(--bg); }
    .top.on-photo:not(.solid) .cart b span { color: #111; }
    .cart b.has { background: var(--main); } .cart b.has span { color: #fff !important; }

    /* Первый экран: длинная секция, внутри липкая сцена. --p от 0 до 1 задаёт прокрутка */
    .hero { height: 230vh; position: relative; }
    .stage { position: sticky; top: 0; height: 100svh; overflow: hidden; }
    .stage h1 { position: absolute; left: 16px; right: 16px; top: calc(76px - var(--p, 0) * 140px); font-size: clamp(54px, 15.5vw, 190px); line-height: .9; opacity: calc(1 - var(--p, 0) * 2.2); }
    .frame { position: absolute; left: 50%; bottom: calc(26px * (1 - var(--p, 0))); width: calc(56vw + var(--p, 0) * 44vw); height: calc(36svh + var(--p, 0) * 64svh); transform: translateX(-50%); border-radius: calc(26px * (1 - var(--p, 0))); overflow: hidden; }
    .frame img { width: 100%; height: 100%; object-fit: cover; transform: scale(calc(1.25 - var(--p, 0) * .25)); }
    .frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 30%, rgba(0,0,0,.6)); opacity: var(--p, 0); }
    .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 34px; color: #fff; opacity: calc((var(--p, 0) - .7) * 3.4); transform: translateY(calc((1 - var(--p, 0)) * 40px)); }
    .over p { max-width: 34ch; margin: 0 0 18px; font-size: 17px; }
    .over .btn { background: #fff; color: #111; }
    .sub { position: absolute; left: 16px; bottom: calc(36svh + 46px); max-width: 30ch; font-size: 15px; opacity: calc(1 - var(--p, 0) * 3); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 15px 24px; border-radius: 999px; border: 0; background: var(--main); color: #fff; font: 500 15px var(--font-body); text-decoration: none; cursor: pointer; }

    /* Веер: позиции лежат стопкой и раскладываются как карты в руке */
    .fan { height: 210vh; position: relative; }
    .fan .stage { display: grid; place-items: center; }
    .fan h2 { position: absolute; top: 90px; left: 16px; right: 16px; font-size: clamp(40px, 11vw, 120px); line-height: .95; }
    .deck { position: relative; width: 40vw; max-width: 300px; aspect-ratio: 3 / 4; margin-top: 18vh; }
    .deck figure { position: absolute; inset: 0; margin: 0; border-radius: 20px; overflow: hidden; background: var(--milk); box-shadow: 0 30px 50px -30px rgba(28,20,16,.55);
      transform: translateX(calc(var(--o) * var(--q, 0) * 14.5vw)) translateY(calc(var(--a) * var(--a) * var(--q, 0) * 1.6vw)) rotate(calc(var(--o) * (2deg + var(--q, 0) * 8deg))); transform-origin: 50% 120%; }
    .deck img { width: 100%; height: 100%; object-fit: cover; }
    .deck figcaption { position: absolute; left: 10px; right: 10px; bottom: 10px; background: color-mix(in srgb, var(--milk) 90%, transparent); border-radius: 12px; padding: 7px 10px; font-size: 13px; line-height: 1.2; opacity: var(--q, 0); }

    /* Меню */
    .menu { padding: 40px 0 30px; }
    .menu h2 { font-size: clamp(44px, 12vw, 110px); line-height: .92; }
    .lead { max-width: 38ch; opacity: .7; margin: 14px 0 22px; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 18px; padding: 0 16px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); background: none; color: inherit; border-radius: 999px; padding: 9px 16px; font: 500 14px var(--font-body); cursor: pointer; }
    .tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 12px; }
    .item[hidden] { display: none; }
    .item .ph { aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; background: var(--milk); position: relative; }
    .item .ph img { width: 100%; height: 100%; object-fit: cover; }
    .item .noimg { display: grid; place-items: center; height: 100%; font-size: 60px; }
    .item h3 { font: 500 16px/1.2 var(--font-body); letter-spacing: 0; margin: 10px 0 2px; }
    .item small { display: block; opacity: .6; font-size: 13px; line-height: 1.35; }
    .item .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .item .price { font: 300 22px var(--font-head); letter-spacing: -.03em; }
    .add { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font: 400 22px/1 var(--font-body); cursor: pointer; transition: background .3s, transform .2s; }
    .add:active { transform: scale(.92); }
    .add.done { background: var(--main); font-size: 0; } .add.done::after { content: "✓"; font-size: 17px; }
    .tag { position: absolute; top: 10px; left: 10px; background: var(--milk); border-radius: 999px; padding: 5px 10px; font-size: 12px; }

    /* Фраза о месте: слова проявляются по мере прокрутки */
    .say { padding: 70px 0; }
    .say p { font: 200 clamp(30px, 8.4vw, 76px)/1.08 var(--font-head); letter-spacing: -.035em; margin: 0; max-width: 18ch; }
    .say p span { opacity: .14; transition: opacity .25s; }
    .say p span.lit { opacity: 1; }
    .feats { display: grid; gap: 0; margin-top: 40px; }
    .feats div { padding: 18px 0; border-top: 1px solid color-mix(in srgb, var(--text) 16%, transparent); display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
    .feats strong { font-weight: 500; }
    .feats span { opacity: .68; }

    .find { padding: 30px 0 50px; }
    .find h2 { font-size: clamp(44px, 12vw, 110px); line-height: .92; }
    .rows { margin: 26px 0 28px; }
    .rows > * { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--text) 14%, transparent); text-decoration: none; }
    .rows small { opacity: .6; } .rows strong { font-weight: 500; text-align: right; }
    footer { padding: 0 0 32px; font-size: 13px; opacity: .65; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
    .c-demo { position: relative; z-index: 31; }
    .c-drawer h3 { font-weight: 300; letter-spacing: -.03em; }
    .c-send { border-radius: 999px; }

    @media (min-width: 860px) {
      .stage h1 { left: 40px; right: 40px; max-width: 12ch; }
      .sub { left: auto; right: 40px; bottom: auto; top: 110px; }
      .frame { width: calc(34vw + var(--p, 0) * 66vw); height: calc(46svh + var(--p, 0) * 54svh); }
      .over { padding: 0 40px 48px; }
      .deck { width: 22vw; } .deck figure { transform: translateX(calc(var(--o) * var(--q, 0) * 14vw)) translateY(calc(var(--a) * var(--q, 0) * 1.4vw)) rotate(calc(var(--o) * (3deg + var(--q, 0) * 7deg))); }
      .grid { grid-template-columns: repeat(4, 1fr); gap: 28px 18px; }
      .say p { max-width: 20ch; }
      .feats { grid-template-columns: repeat(3, 1fr); gap: 0 24px; } .feats div { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero, .fan { height: auto; } .stage { position: relative; height: auto; min-height: 100svh; }
      .say p span { opacity: 1; }
    }
  </style>
  <script src="data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/core.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
  (function () {
    var D = Core.data, e = Core.esc, X = Core.x;
    var hp = D.hero.photo || (D.items[0] && D.items[0].photo) || "";
    var G = (X.groups || []).map(function (g) { return { label: g[0], re: new RegExp(g[1], "i") }; });
    function grp(i) { for (var k = 0; k < G.length; k++) if (G[k].re.test(i.name + " " + i.desc + " " + i.tag)) return k; return -1; }
    var used = G.filter(function (g, k) { return D.items.some(function (i) { return grp(i) === k; }); });

    var deck = D.items.filter(function (i) { return i.photo; }).slice(0, 5);
    var mid = (deck.length - 1) / 2;
    var cards = deck.map(function (i, n) {
      var o = n - mid;
      return '<figure style="--o:' + o + ';--a:' + Math.abs(o) + ';z-index:' + (10 - Math.round(Math.abs(o))) + '">' + Core.pic(i) + '<figcaption>' + e(i.name) + '</figcaption></figure>';
    }).join("");

    var items = D.items.map(function (i) {
      return '<article class="item" data-g="' + grp(i) + '"><div class="ph">' + Core.pic(i) + (i.tag ? '<span class="tag">' + e(i.tag) + '</span>' : '') + '</div>' +
        '<h3>' + e(i.name) + '</h3>' + (i.desc ? '<small>' + e(i.desc) + '</small>' : '') +
        '<div class="row"><span class="price">' + Core.money(i.price) + '</span><button class="add" data-add="' + e(i.id) + '" aria-label="' + e((D.sections.addLabel || "Добавить") + ": " + i.name) + '">+</button></div></article>';
    }).join("");

    var words = (D.sections.aboutText || "").split(/\s+/).map(function (w) { return "<span>" + e(w) + "</span>"; }).join(" ");
    var rows = Core.contacts().map(function (r) {
      var inner = '<small>' + e(r[0]) + '</small><strong>' + e(r[1]) + '</strong>';
      return r[2] ? '<a href="' + e(r[2]) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div>' + inner + '</div>';
    }).join("");

    Core.mount(
      '<header class="top" id="top-bar"><div class="wrap"><a class="logo" href="#top">' + e(D.brand.name) + '</a>' +
        '<button class="cart" data-open-cart>' + e(X.cartBtn || "Заказ") + ' <b data-count-wrap><span data-count>0</span></b></button></div></header>' +
      '<main id="top"><section class="hero" data-scrub="p"><div class="stage"><h1>' + e(X.heroTitle || D.hero.title) + '</h1>' +
        '<p class="sub">' + e(D.brand.city ? D.brand.city + ". " : "") + e(D.brand.tagline || "") + '</p>' +
        '<div class="frame">' + (hp ? '<img src="' + e(hp) + '" alt="">' : '') + '</div>' +
        '<div class="over"><p>' + e(D.hero.text) + '</p><a class="btn" href="#menu">' + e(D.hero.cta) + '</a></div></div></section>' +
      (deck.length > 2 ? '<section class="fan" data-scrub="q"><div class="stage"><h2>' + e(X.fanTitle || "Что сегодня в чашке") + '</h2><div class="deck">' + cards + '</div></div></section>' : '') +
      '<section class="menu" id="menu"><div class="wrap"><h2>' + e(D.sections.catalogTitle) + '</h2><p class="lead">' + e(D.sections.catalogText) + '</p>' +
        (used.length > 1 ? '<div class="tabs" role="group" aria-label="Разделы меню"><button class="on" data-g="all">' + e(X.allLabel || "Всё") + '</button>' + G.map(function (g, k) { return used.indexOf(g) >= 0 ? '<button data-g="' + k + '">' + e(g.label) + '</button>' : ''; }).join("") + '</div>' : '') +
        '<div class="grid">' + items + '</div></div></section>' +
      '<section class="say"><div class="wrap"><p data-words>' + words + '</p><div class="feats">' +
        D.features.map(function (f) { return '<div><strong>' + e(f.title) + '</strong><span>' + e(f.text) + '</span></div>'; }).join("") + '</div></div></section>' +
      '<section class="find" id="contacts"><div class="wrap"><h2>' + e(X.orderTitle || "Заходите") + '</h2><div class="rows">' + rows + '</div>' +
        (D.contacts.whatsapp ? '<a class="btn" href="' + Core.wa(X.orderMsg || "Здравствуйте! Хочу сделать заказ") + '" target="_blank" rel="noopener">Написать в WhatsApp</a>' : '') + '</div></section></main>' +
      '<footer><div class="wrap"><span>© ' + new Date().getFullYear() + ' ' + e(D.brand.name) + (D.credits ? '. ' + e(D.credits) : '') + '</span><span><a href="admin.html">Вход для владельца</a>. Сайт сделан в <a href="https://instagram.com/shak.web" target="_blank" rel="noopener">shak.web</a></span></div></footer>'
    );

    // Счётчик корзины: класс has ставит движок на элемент с data-count, переносим его на кружок
    var cnt = document.querySelector("[data-count]"), wrap = document.querySelector("[data-count-wrap]");
    new MutationObserver(function () { wrap.classList.toggle("has", cnt.classList.contains("has")); }).observe(cnt, { attributes: true });

    // Прокрутка задаёт --p (первый экран) и --q (веер); слова фразы загораются по очереди
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var scrubs = [].slice.call(document.querySelectorAll("[data-scrub]")), bar = document.getElementById("top-bar");
    var say = document.querySelector("[data-words]"), spans = say ? [].slice.call(say.querySelectorAll("span")) : [];
    function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function frame() {
      var vh = innerHeight;
      scrubs.forEach(function (s) {
        var r = s.getBoundingClientRect(), p = reduce ? 1 : clamp(-r.top / (r.height - vh));
        s.style.setProperty("--" + s.dataset.scrub, p.toFixed(4));
      });
      var hero = scrubs[0].getBoundingClientRect();
      bar.classList.toggle("on-photo", hero.bottom > vh * .5 && parseFloat(scrubs[0].style.getPropertyValue("--p")) > .55);
      bar.classList.toggle("solid", hero.bottom < vh * .5);
      if (say) { var sr = say.getBoundingClientRect(), k = reduce ? 1 : clamp((vh * .85 - sr.top) / (sr.height + vh * .35)); var lit = Math.round(k * spans.length); spans.forEach(function (sp, n) { sp.classList.toggle("lit", n < lit); }); }
    }
    var ticking = false;
    addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; frame(); }); } }, { passive: true });
    addEventListener("resize", frame); frame();

    document.addEventListener("click", function (ev) {
      var b = ev.target.closest(".tabs [data-g]"); if (!b) return;
      [].forEach.call(document.querySelectorAll(".tabs [data-g]"), function (x) { x.classList.toggle("on", x === b); });
      [].forEach.call(document.querySelectorAll(".item"), function (c) { c.hidden = b.dataset.g !== "all" && c.dataset.g !== b.dataset.g; });
    });
  })();
  </script>
</body>
</html>
