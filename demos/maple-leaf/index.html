<!doctype html>
<html lang="ru" data-fonts="Geologica|Onest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌺</text></svg>">
  <title>Maple leaf | Цветы с доставкой</title>
  <meta name="description" content="Maple leaf, Челябинск. Соберём букет под ваш бюджет и привезём вовремя.">
  <meta property="og:title" content="Maple leaf">
  <meta property="og:description" content="Соберём букет под ваш бюджет и привезём вовремя.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;500;700&family=Onest:wght@400;500;600&display=swap">
  <style>
    :root { --main: #D9261C; --accent: #F4D3CC; --bg: #FBF6F3; --text: #1C1312; --ok: #2E5A3A; --soft: #F3E9E4; --c-radius: 16px; --ease: cubic-bezier(.2, .8, .2, 1); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3 { font-family: var(--font-head); font-weight: 500; letter-spacing: -.03em; margin: 0; }
    .wrap { width: min(1180px, 100% - 24px); margin: 0 auto; }

    /* Шапка: плавающая капсула */
    .top { position: sticky; top: 10px; z-index: 30; margin-top: 10px; }
    .top .wrap { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); box-shadow: 0 8px 30px -14px rgba(28,19,18,.25); }
    .logo { margin-right: auto; display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 17px var(--font-head); letter-spacing: -.02em; }
    .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--main); box-shadow: 0 0 0 4px var(--accent); }
    .cart { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 10px 10px 16px; background: var(--text); color: var(--bg); font: 500 14px var(--font-body); cursor: pointer; }
    .cart b { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 12px; transition: background .3s; }
    .cart b.has { background: var(--main); }

    /* Первый экран: фото на всю ширину, заголовок поднимается из-под маски */
    .hero { padding-top: 12px; }
    .stage { position: relative; height: min(84svh, 760px); min-height: 540px; border-radius: 30px; overflow: hidden; color: #fff; isolation: isolate; }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; animation: settle 2.4s var(--ease) both; }
    .stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(28,19,18,.05) 30%, rgba(28,19,18,.72) 100%); }
    @keyframes settle { from { transform: scale(1.14); } to { transform: none; } }
    .stage .in { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 20px 26px; }
    .stage h1 { font-size: clamp(38px, 10.5vw, 88px); line-height: .98; max-width: 14ch; }
    .stage h1 > span { display: block; overflow: hidden; padding-bottom: .06em; }
    .stage h1 > span > span { display: block; animation: rise 1.1s var(--ease) both; }
    .stage h1 > span:nth-child(2) > span { animation-delay: .1s; } .stage h1 > span:nth-child(3) > span { animation-delay: .2s; } .stage h1 > span:nth-child(4) > span { animation-delay: .3s; }
    @keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
    .stage p { margin: 14px 0 20px; max-width: 40ch; opacity: .9; animation: fade 1s .5s both; }
    @keyframes fade { from { opacity: 0; } }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; animation: fade 1s .6s both; }
    .chips span { padding: 7px 12px; border-radius: 999px; font-size: 13px; background: rgba(255,255,255,.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.22); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 16px 26px; border-radius: 999px; border: 0; background: var(--main); color: #fff; font: 600 16px var(--font-body); text-decoration: none; cursor: pointer; transition: transform .3s var(--ease); }
    .btn:hover { transform: translateY(-2px); }
    .stage .btn { animation: fade 1s .7s both; }

    /* Каталог: на телефоне листается пальцем, как в приложении */
    .shop { padding: 64px 0 24px; }
    .head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .shop h2, .why h2, .find h2 { font-size: clamp(32px, 7.5vw, 56px); line-height: 1; }
    .head p { margin: 10px 0 0; max-width: 40ch; opacity: .7; }
    .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--soft); }
    .seg button { border: 0; background: none; padding: 9px 16px; border-radius: 999px; font: 500 14px var(--font-body); color: var(--text); cursor: pointer; transition: background .3s, color .3s; }
    .seg button.on { background: var(--text); color: var(--bg); }
    .rail { display: grid; grid-auto-flow: column; grid-auto-columns: 80%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 12px; padding: 4px 12px 18px; margin: 0 -12px; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .card { scroll-snap-align: start; position: relative; border-radius: 26px; overflow: hidden; aspect-ratio: 3 / 4.2; background: var(--soft); }
    .card[hidden] { display: none; }
    .card > img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
    .card:hover > img { transform: scale(1.05); }
    .card .noimg { display: grid; place-items: center; height: 100%; font-size: 80px; }
    .panel { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 14px 12px 14px 16px; border-radius: 20px; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
    .panel h3 { font-size: 19px; line-height: 1.15; letter-spacing: -.02em; }
    .panel small { grid-column: 1; opacity: .65; font-size: 13px; line-height: 1.3; }
    .panel .price { grid-column: 1; font: 700 18px var(--font-head); margin-top: 4px; }
    .add { grid-column: 2; grid-row: 1 / span 3; border: 0; border-radius: 999px; background: var(--text); color: var(--bg); font: 500 14px var(--font-body); padding: 12px 14px; white-space: nowrap; cursor: pointer; transition: background .3s, transform .2s; }
    .add:active { transform: scale(.95); }
    .add.done { background: var(--ok); }
    .ask { scroll-snap-align: start; border-radius: 26px; aspect-ratio: 3 / 4.2; background: var(--main); color: #fff; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; }
    .ask strong { font: 500 clamp(26px, 6vw, 30px)/1.1 var(--font-head); letter-spacing: -.03em; }
    .ask span { align-self: flex-start; background: #fff; color: var(--text); border-radius: 999px; padding: 12px 18px; font-weight: 600; }
    .badge { position: absolute; top: 12px; left: 12px; padding: 6px 11px; border-radius: 999px; background: #fff; font: 500 12px var(--font-body); }

    /* О мастерской: тёмный блок, текст проявляется при прокрутке */
    .why { margin: 40px 0; }
    .why .box { background: var(--text); color: var(--bg); border-radius: 30px; padding: 40px 22px; display: grid; gap: 28px; }
    .why ul { list-style: none; margin: 0; padding: 0; }
    .why li { padding: 18px 0; border-top: 1px solid rgba(255,255,255,.14); display: grid; gap: 4px; }
    .why li strong { font: 500 22px/1.15 var(--font-head); letter-spacing: -.02em; }
    .why li span { opacity: .65; }
    .say { font: 300 clamp(22px, 5.6vw, 32px)/1.3 var(--font-head); letter-spacing: -.02em; margin: 20px 0 0; }
    [data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
    [data-reveal].in { opacity: 1; transform: none; }

    .find { padding: 24px 0 48px; }
    .find .box { border-radius: 30px; background: var(--soft); padding: 32px 20px; display: grid; gap: 24px; }
    .find p { opacity: .7; max-width: 34ch; margin: 12px 0 22px; }
    .rows > * { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--text) 12%, transparent); text-decoration: none; }
    .rows small { opacity: .6; }
    .rows strong { font-weight: 500; text-align: right; }
    footer { padding: 0 0 30px; font-size: 13px; opacity: .7; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
    .c-drawer { border-radius: 26px 0 0 26px; }
    .c-drawer h3 { font-weight: 500; letter-spacing: -.02em; }
    .c-send { border-radius: 999px; }

    @media (min-width: 800px) {
      .top .wrap { width: min(760px, 100% - 24px); }
      .stage .in { padding: 48px; }
      .stage h1 { font-size: clamp(48px, 6vw, 80px); max-width: 18ch; }
      .rail { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); overflow: visible; margin: 0; padding: 4px 0; gap: 16px; }
      .why .box { grid-template-columns: 1fr 1fr; padding: 56px; gap: 56px; }
      .find .box { grid-template-columns: 1fr 1fr; padding: 48px; align-items: start; }
    }
  </style>
  <script src="data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/core.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
  (function () {
    var D = Core.data, e = Core.esc, X = Core.x;
    var hp = D.hero.photo || (D.items[0] && D.items[0].photo) || "";
    // Фильтры над каталогом: [подпись, слова через |]. По умолчанию букеты и композиции
    var F = (X.filters || [["Букеты", ""], ["Композиции", "композиц"]]).map(function (f) { return { label: f[0], re: f[1] ? new RegExp(f[1], "i") : null }; });
    function kind(i) { for (var k = 0; k < F.length; k++) if (F[k].re && F[k].re.test(i.name + " " + i.tag + " " + i.desc)) return k; for (k = 0; k < F.length; k++) if (!F[k].re) return k; return -1; }
    var used = F.filter(function (f, k) { return D.items.some(function (i) { return kind(i) === k; }); });

    // Заголовок по строкам, чтобы каждая строка выезжала по очереди
    var lines = [], cur = "";
    D.hero.title.split(" ").forEach(function (w) { if ((cur + " " + w).trim().length > (innerWidth < 800 ? 15 : 24) && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
    if (cur) lines.push(cur);
    var h1 = lines.map(function (l) { return "<span><span>" + e(l) + "</span></span>"; }).join("");

    var cards = D.items.map(function (i) {
      return '<article class="card" data-kind="' + kind(i) + '">' + Core.pic(i) +
        (i.tag ? '<span class="badge">' + e(i.tag) + '</span>' : '') +
        '<div class="panel"><h3>' + e(i.name) + '</h3>' + (i.desc ? '<small>' + e(i.desc) + '</small>' : '') +
        '<span class="price">' + Core.money(i.price) + '</span><button class="add" data-add="' + e(i.id) + '">' + e(D.sections.addLabel || "В корзину") + '</button></div></article>';
    }).join("");

    var rows = Core.contacts().map(function (r) {
      var inner = '<small>' + e(r[0]) + '</small><strong>' + e(r[1]) + '</strong>';
      return r[2] ? '<a href="' + e(r[2]) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div>' + inner + '</div>';
    }).join("");

    Core.mount(
      '<header class="top"><div class="wrap"><a class="logo" href="#top"><i></i>' + e(D.brand.name) + '</a>' +
        '<button class="cart" data-open-cart>' + e(D.sections.cartLabel || "Корзина") + '<b data-count>0</b></button></div></header>' +
      '<main id="top"><section class="hero"><div class="wrap"><div class="stage">' + (hp ? '<img src="' + e(hp) + '" alt="">' : '') +
        '<div class="in"><div class="chips">' + D.features.slice(0, 2).map(function (f) { return '<span>' + e(f.title) + '</span>'; }).join("") + '</div>' +
        '<h1>' + h1 + '</h1><p>' + e(D.hero.text) + '</p><a class="btn" href="#shop">' + e(D.hero.cta) + '</a></div></div></div></section>' +
      '<section class="shop" id="shop"><div class="wrap"><div class="head"><div><h2>' + e(D.sections.catalogTitle) + '</h2><p>' + e(D.sections.catalogText) + '</p></div>' +
        (used.length > 1 ? '<div class="seg" role="group" aria-label="Что показать"><button class="on" data-f="all">Все</button>' + F.map(function (f, k) { return used.indexOf(f) >= 0 ? '<button data-f="' + k + '">' + e(f.label) + '</button>' : ''; }).join("") + '</div>' : '') +
        '</div><div class="rail">' + cards + (D.contacts.whatsapp ? '<a class="ask" href="' + Core.wa(X.askMsg || "Здравствуйте! Соберите, пожалуйста, букет по моему желанию") + '" target="_blank" rel="noopener"><strong>' + e(X.askTitle || "Не нашли свой букет? Соберём по вашему желанию и бюджету") + '</strong><span>' + e(X.askBtn || "Написать флористу") + '</span></a>' : '') + '</div></div></section>' +
      '<section class="why"><div class="wrap"><div class="box"><div><h2>' + e(D.sections.aboutTitle) + '</h2><p class="say" data-reveal>' + e(D.sections.aboutText) + '</p></div>' +
        '<ul>' + D.features.map(function (f) { return '<li data-reveal><strong>' + e(f.title) + '</strong><span>' + e(f.text) + '</span></li>'; }).join("") + '</ul></div></div></section>' +
      '<section class="find" id="contacts"><div class="wrap"><div class="box"><div><h2>' + e(X.orderTitle || "Заказать") + '</h2><p>' + e(X.orderText || "Напишите, кому букет и к какому времени. Подскажем и пришлём фото до отправки.") + '</p>' +
        (D.contacts.whatsapp ? '<a class="btn" href="' + Core.wa(X.orderMsg || "Здравствуйте! Хочу заказать букет") + '" target="_blank" rel="noopener">Написать в WhatsApp</a>' : '') + '</div><div class="rows">' + rows + '</div></div></div></section></main>' +
      '<footer><div class="wrap"><span>© ' + new Date().getFullYear() + ' ' + e(D.brand.name) + (D.credits ? '. ' + e(D.credits) : '') + '</span><span><a href="admin.html">Вход для владельца</a>. Сайт сделан в <a href="https://instagram.com/shak.web" target="_blank" rel="noopener">shak.web</a></span></div></footer>'
    );

    document.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-f]"); if (!b) return;
      [].forEach.call(document.querySelectorAll("[data-f]"), function (x) { x.classList.toggle("on", x === b); });
      [].forEach.call(document.querySelectorAll(".card"), function (c) { c.hidden = b.dataset.f !== "all" && c.dataset.kind !== b.dataset.f; });
      document.querySelector(".rail").scrollTo({ left: 0, behavior: "smooth" });
    });
  })();
  </script>
</body>
</html>
