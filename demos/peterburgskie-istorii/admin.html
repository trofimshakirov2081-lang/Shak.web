<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
  <title>Админка: Петербургские истории</title>
  <link rel="stylesheet" href="assets/admin.css">
  <script src="data.js"></script>
  <script src="assets/store.js"></script>
</head>
<body>
  <div id="login" class="login">
    <form class="login-box" id="loginForm">
      <div class="badge">Админка</div>
      <h1 id="loginTitle">Вход</h1>
      <p>Здесь вы сами меняете цены, тексты, фото и цвета сайта.</p>
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN-код" autocomplete="current-password" aria-label="PIN-код">
      <button class="primary" type="submit">Войти</button>
      <p class="hint" id="pinHint"></p>
      <p class="err" id="loginErr" hidden>Неверный PIN</p>
    </form>
  </div>

  <div id="admin" class="admin" hidden>
    <header class="bar">
      <strong id="siteName">Сайт</strong>
      <nav class="tabs" id="tabs">
        <button data-tab="items" class="on">Товары и цены</button>
        <button data-tab="texts">Тексты</button>
        <button data-tab="design">Дизайн</button>
        <button data-tab="contacts">Контакты</button>
        <button data-tab="more">Ещё</button>
      </nav>
      <a class="view" href="index.html" target="_blank" rel="noopener">Открыть сайт ↗</a>
    </header>
    <main class="layout">
      <section class="panel" id="panel"></section>
      <section class="preview"><iframe id="frame" src="index.html" title="Предпросмотр сайта"></iframe></section>
    </main>
    <div class="savebar">
      <span id="status">Все изменения сохранены</span>
      <button class="primary" id="saveBtn">Сохранить</button>
    </div>
  </div>
  <script src="assets/admin.js"></script>
</body>
</html>
