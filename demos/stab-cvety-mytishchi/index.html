<!doctype html>
<html lang="ru" data-fonts="Cormorant Garamond|Manrope">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥀</text></svg>">
  <title>Цветы, которые не вянут | Цветочная студия</title>
  <meta name="description" content="Цветы, которые не вянут, Мытищи. Выберите букет и отправьте заказ в WhatsApp. Пришлём фото перед доставкой.">
  <meta property="og:title" content="Цветы, которые не вянут">
  <meta property="og:description" content="Выберите букет и отправьте заказ в WhatsApp. Пришлём фото перед доставкой.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap">
  <style>
    /* Вечерний дизайн: винный фон, кремовый текст, фото в арках, каталог как карта в ресторане */
    :root { --bg: #2A1215; --text: #F1E7DA; --main: #D9B48F; --accent: #5A2228; --deep: #1F0C0F; --line: rgba(241,231,218,.16); --c-radius: 4px; --c-surface: #2A1215; --ease: cubic-bezier(.2, .8, .2, 1); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3 { font-family: var(--font-head); font-weight: 400; margin: 0; }
    .wrap { width: min(1080px, 100% - 32px); margin: 0 auto; }

    .top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
    .logo { font: italic 500 24px/1 var(--font-head); text-decoration: none; letter-spacing: .01em; }
    .cart { border: 1px solid var(--main); background: none; color: var(--main); border-radius: 999px; padding: 8px 16px; font: 500 13px var(--font-body); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
    .cart b { font-weight: 600; }
    .cart b.has { color: var(--bg); background: var(--main); border-radius: 999px; padding: 0 7px; }

    /* Первый экран: фото в арке раскрывается снизу вверх, название набрано крупно поверх */
    .hero { padding: 26px 0 40px; text-align: center; }
    .city { font-size: 13px; opacity: .6; margin: 0 0 18px; }
    .arch { position: relative; width: min(78%, 420px); aspect-ratio: 3 / 4; margin: 0 auto; border-radius: 999px 999px 0 0; overflow: hidden; animation: open 1.6s .1s var(--ease) both; }
    .arch img { width: 100%; height: 100%; object-fit: cover; animation: drift 2.6s var(--ease) both; }
    .arch::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(241,231,218,.25); background: linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--bg) 85%, transparent) 100%); }
    @keyframes open { from { clip-path: inset(100% 0 0 0 round 999px 999px 0 0); } to { clip-path: inset(0 0 0 0 round 999px 999px 0 0); } }
    @keyframes drift { from { transform: scale(1.18); } to { transform: none; } }
    .hero h1 { font: italic 400 clamp(46px, 13vw, 110px)/.92 var(--font-head); margin: -0.62em auto 0; position: relative; max-width: 12ch; animation: up 1.2s .5s var(--ease) both; }
    @keyframes up { from { opacity: 0; transform: translateY(30px); } }
    .hero p { max-width: 34ch; margin: 18px auto 24px; opacity: .78; animation: up 1s .8s var(--ease) both; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 15px 30px; border-radius: 999px; background: var(--main); color: var(--deep); font: 600 15px var(--font-body); text-decoration: none; border: 0; cursor: pointer; transition: transform .3s var(--ease); }
    .hero .btn { animation: up 1s .95s var(--ease) both; }
    .btn:hover { transform: translateY(-2px); }
    .marks { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 22px; margin-top: 26px; font-size: 13px; opacity: .7; animation: up 1s 1.1s var(--ease) both; }

    /* Каталог: первая позиция крупно, остальные строками с точками до цены */
    .menu { padding: 50px 0 30px; border-top: 1px solid var(--line); }
    .menu h2, .story h2, .visit h2 { font: italic 400 clamp(38px, 10vw, 68px)/1 var(--font-head); text-align: center; }
    .menu .lead { text-align: center; opacity: .65; max-width: 36ch; margin: 12px auto 34px; }
    .star { display: grid; gap: 18px; margin-bottom: 30px; }
    .star .ph { border-radius: 999px 999px 0 0; overflow: hidden; aspect-ratio: 4 / 4.4; background: var(--accent); }
    .star .ph img { width: 100%; height: 100%; object-fit: cover; }
    .star h3 { font: italic 500 34px/1.05 var(--font-head); }
    .star p { margin: 6px 0 14px; opacity: .7; }
    .star .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .star .price { font: 600 28px var(--font-head); color: var(--main); }
    .tag { display: inline-block; font-size: 12px; color: var(--main); margin-bottom: 8px; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .list .th { width: 64px; height: 80px; border-radius: 999px 999px 0 0; overflow: hidden; background: var(--accent); }
    .list .th img { width: 100%; height: 100%; object-fit: cover; }
    .list .noimg { display: grid; place-items: center; height: 100%; font-size: 28px; }
    .nm { display: flex; align-items: baseline; gap: 8px; }
    .nm h3 { font: 500 22px/1.15 var(--font-head); }
    .nm i { flex: 1; border-bottom: 1px dotted rgba(241,231,218,.35); transform: translateY(-4px); min-width: 12px; }
    .nm b { font: 600 19px var(--font-head); color: var(--main); white-space: nowrap; }
    .list small { display: block; opacity: .6; font-size: 13px; line-height: 1.4; margin-top: 2px; }
    .add { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--main); background: none; color: var(--main); font: 400 22px/1 var(--font-body); cursor: pointer; transition: background .3s, color .3s, transform .2s; }
    .add:active { transform: scale(.92); }
    .add.done { background: var(--main); color: var(--deep); font-size: 0; }
    .add.done::after { content: "✓"; font-size: 18px; }
    .star .add { width: auto; height: auto; border-radius: 999px; padding: 12px 22px; font: 600 14px var(--font-body); }
    .star .add.done { font-size: 14px; } .star .add.done::after { content: none; }

    /* О нас: большая цитата, преимущества столбиком */
    .story { padding: 60px 0; background: var(--deep); text-align: center; }
    .quote { font: italic 400 clamp(26px, 6.6vw, 40px)/1.25 var(--font-head); max-width: 26ch; margin: 22px auto 40px; }
    .feats { display: grid; gap: 26px; max-width: 760px; margin: 0 auto; }
    .feats div { display: grid; gap: 4px; }
    .feats strong { font: 600 21px var(--font-head); color: var(--main); }
    .feats span { opacity: .7; }
    [data-reveal] { opacity: 0; transform: translateY(20px); transition: opacity 1.1s var(--ease), transform 1.1s var(--ease); }
    [data-reveal].in { opacity: 1; transform: none; }

    .visit { padding: 60px 0 40px; text-align: center; }
    .visit > .wrap > p { opacity: .7; max-width: 34ch; margin: 12px auto 24px; }
    .rows { max-width: 560px; margin: 34px auto 0; text-align: left; }
    .rows > * { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
    .rows small { opacity: .55; }
    .rows strong { font-weight: 500; text-align: right; }
    footer { padding: 10px 0 34px; font-size: 12px; opacity: .6; text-align: center; }
    footer span { display: block; margin-top: 4px; }

    .c-demo { background: var(--main); color: var(--deep); }
    .c-drawer h3 { font-style: italic; }
    .c-send { background: var(--main); color: var(--deep); border-radius: 999px; }
    .c-qty button { border-color: var(--line); }

    @media (min-width: 820px) {
      .hero { padding-top: 40px; }
      .star { grid-template-columns: 1fr 1fr; align-items: center; gap: 48px; }
      .feats { grid-template-columns: repeat(3, 1fr); text-align: left; }
      .list { columns: 2; column-gap: 48px; }
      .list li { break-inside: avoid; }
    }
  </style>
  <script src="data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/core.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
  (function () {
    var D = Core.data, e = Core.esc, X = Core.x;
    var hp = D.hero.photo || (D.items[0] && D.items[0].photo) || "";
    var star = D.items[0], rest = D.items.slice(1);
    function th(i) { return '<div class="th">' + Core.pic(i) + '</div>'; }

    var list = rest.map(function (i) {
      return '<li>' + th(i) + '<div><div class="nm"><h3>' + e(i.name) + '</h3><i></i><b>' + Core.money(i.price) + '</b></div>' +
        (i.desc ? '<small>' + e(i.desc) + '</small>' : '') + '</div><button class="add" data-add="' + e(i.id) + '" aria-label="' + e((D.sections.addLabel || "В корзину") + ": " + i.name) + '">+</button></li>';
    }).join("");

    var rows = Core.contacts().map(function (r) {
      var inner = '<small>' + e(r[0]) + '</small><strong>' + e(r[1]) + '</strong>';
      return r[2] ? '<a href="' + e(r[2]) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div>' + inner + '</div>';
    }).join("");

    Core.mount(
      '<header class="top"><div class="wrap"><a class="logo" href="#top">' + e(D.brand.name) + '</a>' +
        '<button class="cart" data-open-cart>' + e(D.sections.cartLabel || "Корзина") + ' <b data-count>0</b></button></div></header>' +
      '<main id="top"><section class="hero"><div class="wrap">' + (D.brand.city ? '<p class="city">' + e(D.brand.city) + '</p>' : '') +
        (hp ? '<div class="arch"><img src="' + e(hp) + '" alt=""></div>' : '') +
        '<h1>' + e(X.heroTitle || D.hero.title) + '</h1><p>' + e(D.hero.text) + '</p><a class="btn" href="#menu">' + e(D.hero.cta) + '</a>' +
        '<div class="marks">' + D.features.map(function (f) { return '<span>' + e(f.title) + '</span>'; }).join("") + '</div></div></section>' +
      '<section class="menu" id="menu"><div class="wrap"><h2>' + e(D.sections.catalogTitle) + '</h2><p class="lead">' + e(D.sections.catalogText) + '</p>' +
        (star ? '<div class="star"><div class="ph">' + Core.pic(star) + '</div><div>' + (star.tag ? '<span class="tag">' + e(star.tag) + '</span>' : '') +
          '<h3>' + e(star.name) + '</h3><p>' + e(star.desc) + '</p><div class="row"><span class="price">' + Core.money(star.price) + '</span>' +
          '<button class="add" data-add="' + e(star.id) + '">' + e(D.sections.addLabel || "В корзину") + '</button></div></div></div>' : '') +
        '<ul class="list">' + list + '</ul></div></section>' +
      '<section class="story"><div class="wrap"><h2>' + e(D.sections.aboutTitle) + '</h2><p class="quote" data-reveal>' + e(D.sections.aboutText) + '</p>' +
        '<div class="feats">' + D.features.map(function (f) { return '<div data-reveal><strong>' + e(f.title) + '</strong><span>' + e(f.text) + '</span></div>'; }).join("") + '</div></div></section>' +
      '<section class="visit" id="contacts"><div class="wrap"><h2>' + e(X.orderTitle || "Заказать") + '</h2><p>' + e(X.orderText || "Напишите, что хотите заказать и к какому времени. Ответим в течение часа.") + '</p>' +
        (D.contacts.whatsapp ? '<a class="btn" href="' + Core.wa(X.orderMsg || "Здравствуйте! Хочу сделать заказ") + '" target="_blank" rel="noopener">Написать в WhatsApp</a>' : '') +
        '<div class="rows">' + rows + '</div></div></section></main>' +
      '<footer><div class="wrap">© ' + new Date().getFullYear() + ' ' + e(D.brand.name) + (D.credits ? '. ' + e(D.credits) : '') +
        '<span><a href="admin.html">Вход для владельца</a>. Сайт сделан в <a href="https://instagram.com/shak.web" target="_blank" rel="noopener">shak.web</a></span></div></footer>'
    );
  })();
  </script>
</body>
</html>
