<!doctype html>
<html lang="ru" data-fonts="Prata|Inter Tight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  <title>Студия Жара | Студия красоты</title>
  <meta name="description" content="Студия Жара, Тобольск. Выберите услугу и запишитесь в WhatsApp. Тобольск.">
  <meta property="og:title" content="Студия Жара">
  <meta property="og:description" content="Выберите услугу и запишитесь в WhatsApp. Тобольск.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Inter+Tight:wght@400;500;600&display=swap">
  <style>
    :root { --main: #B4566E; --accent: #E9C9C6; --bg: #F6F0EC; --text: #2A1F1D; --mocha: #5B4038; --blush: #EFE3DC; --c-radius: 14px; --ease: cubic-bezier(.2, .8, .2, 1); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 400; margin: 0; letter-spacing: -.01em; }
    .wrap { width: min(1120px, 100% - 32px); margin: 0 auto; }

    .top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .top .wrap { display: flex; align-items: center; gap: 8px; height: 60px; }
    .logo { margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-decoration: none; font: 400 17px/1.2 var(--font-head); white-space: nowrap; }
    .sel { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); background: none; color: var(--text); font: 500 14px var(--font-body); padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .sel b { min-width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--blush); }
    .sel b.has { background: var(--main); color: #fff; }
    .book { background: var(--text); color: var(--bg); text-decoration: none; font: 500 14px var(--font-body); padding: 10px 14px; border-radius: 999px; white-space: nowrap; }

    /* Первый экран: линии разметки бровей рисуются поверх фото */
    .shot { position: relative; height: 60svh; min-height: 420px; overflow: hidden; border-radius: 0 0 36px 36px; background: #E9D8CC; }
    .shot .inner { position: absolute; top: 0; height: 100%; aspect-ratio: 1200 / 801; left: 50%; transform: translateX(-37%); }
    .shot img, .shot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .shot img { animation: zoom 3s var(--ease) both; }
    @keyframes zoom { from { transform: scale(1.08); } }
    .shot line, .shot path { stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 1.4s var(--ease) forwards; filter: drop-shadow(0 0 6px rgba(180,86,110,.7)); }
    .shot .l1 { animation-delay: .6s; } .shot .l2 { animation-delay: .9s; } .shot .l3 { animation-delay: 1.2s; } .shot .l4 { animation-delay: 1.6s; stroke: var(--main); stroke-width: 4; }
    .shot circle { fill: var(--main); stroke: #fff; stroke-width: 4; opacity: 0; transform-box: fill-box; transform-origin: center; animation: dot .5s var(--ease) forwards; }
    .shot .d1 { animation-delay: 1.7s; } .shot .d2 { animation-delay: 1.9s; } .shot .d3 { animation-delay: 2.1s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes dot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
    .card { position: relative; margin: -70px 16px 0; padding: 26px 22px 24px; border-radius: 28px; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); box-shadow: 0 20px 50px -30px rgba(42,31,29,.5); animation: up 1.1s .3s var(--ease) both; }
    @keyframes up { from { opacity: 0; transform: translateY(30px); } }
    .card h1 { font-size: clamp(30px, 8.4vw, 58px); line-height: 1.08; }
    .card p { margin: 14px 0 22px; max-width: 42ch; opacity: .8; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 15px 24px; border-radius: 999px; border: 0; background: var(--main); color: #fff; font: 500 16px var(--font-body); text-decoration: none; cursor: pointer; transition: transform .3s var(--ease), box-shadow .3s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -12px var(--main); }
    .link { margin-left: 16px; font-weight: 500; text-underline-offset: 4px; }

    /* Курсы: карточки наслаиваются при прокрутке */
    .courses { padding: 72px 0 30px; }
    .courses h2, .svc h2, .about h2, .find h2 { font-size: clamp(32px, 8vw, 54px); line-height: 1.05; }
    .lead { margin: 12px 0 28px; max-width: 48ch; opacity: .75; }
    .stack { display: grid; gap: 18px; }
    .course { position: sticky; top: calc(76px + var(--i) * 12px); border-radius: 30px; overflow: hidden; display: grid; background: var(--bg-c); color: var(--fg-c); box-shadow: 0 -10px 40px -24px rgba(42,31,29,.45); }
    .course .ph { aspect-ratio: 16 / 10; overflow: hidden; }
    .course .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
    .course .noimg { display: grid; place-items: center; height: 100%; font-size: 60px; }
    .course .in { padding: 20px 22px 24px; display: grid; gap: 8px; }
    .lvl { justify-self: start; font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, currentColor 12%, transparent); }
    .course h3 { font-size: clamp(26px, 7vw, 36px); line-height: 1.1; }
    .course p { margin: 0; opacity: .75; }
    .course .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .price { font: 400 26px var(--font-head); }
    .price small { font: 500 13px var(--font-body); opacity: .7; margin-left: 8px; }
    .add { border: 0; border-radius: 999px; background: var(--fg-c); color: var(--bg-c); font: 500 15px var(--font-body); padding: 13px 20px; cursor: pointer; transition: transform .2s; }
    .add:active { transform: scale(.95); }
    .add.done { background: #4E8C6A; color: #fff; }

    .svc { padding: 60px 0; }
    .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .pills a { text-decoration: none; padding: 13px 18px; border-radius: 999px; background: #fff; font-weight: 500; transition: background .3s, color .3s, transform .3s var(--ease); }
    .pills a:hover { background: var(--text); color: var(--bg); transform: translateY(-2px); }

    .about { padding: 20px 0 60px; }
    .about .box { background: var(--text); color: var(--bg); border-radius: 32px; padding: 36px 22px; display: grid; gap: 26px; }
    .about .say { font: 400 clamp(21px, 5.6vw, 30px)/1.35 var(--font-head); margin: 18px 0 0; }
    .about ul { list-style: none; margin: 0; padding: 0; }
    .about li { padding: 16px 0; border-top: 1px solid rgba(255,255,255,.14); }
    .about li strong { display: block; font-weight: 600; }
    .about li span { opacity: .65; }
    [data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
    [data-reveal].in { opacity: 1; transform: none; }

    .find { padding: 0 0 50px; }
    .find .box { background: var(--blush); border-radius: 32px; padding: 32px 22px; display: grid; gap: 22px; }
    .rows > * { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--text) 12%, transparent); text-decoration: none; }
    .rows small { opacity: .6; }
    .rows strong { font-weight: 500; text-align: right; }
    footer { padding: 0 0 28px; font-size: 13px; opacity: .7; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
    .c-drawer { border-radius: 28px 0 0 28px; }
    .c-send { border-radius: 999px; }

    @media (min-width: 820px) {
      .logo { font-size: 24px; }
      .hero { width: min(1120px, 100% - 32px); margin: 16px auto 0; display: grid; grid-template-columns: 1fr 1.3fr; align-items: center; }
      .shot { height: auto; aspect-ratio: 1200 / 801; border-radius: 36px; order: 2; min-height: 0; }
      .shot .inner { left: 0; transform: none; width: 100%; }
      .hero { grid-template-columns: 1fr 1.5fr; }
      .card { margin: 0 -30px 0 0; z-index: 2; padding: 40px; }
      .card h1 { font-size: clamp(36px, 3.6vw, 50px); }
      .stack { gap: 24px; }
      .course { grid-template-columns: 1.1fr 1fr; height: 400px; }
      .course .ph { aspect-ratio: auto; position: relative; }
      .course .ph img { position: absolute; inset: 0; }
      .course .in { padding: 40px; align-content: center; }
      .about .box { grid-template-columns: 1.3fr 1fr; padding: 56px; gap: 56px; }
      .find .box { grid-template-columns: 1fr 1fr; padding: 48px; }
    }
  </style>
  <script src="data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/core.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
  (function () {
    var D = Core.data, e = Core.esc, x = Core.x;
    var hp = D.hero.photo || "";

    // Направление и уровень курса определяем по названию, порядок как в админке
    var TRACKS = [["Брови", /бров|brow/i], ["Ресницы", /ресниц|леш|lash/i], ["Перманент", /перманент|pm\b/i], ["Ногти", /маникюр|педикюр|ногт|nail/i], ["Макияж", /макияж|визаж|образ/i], ["Волосы", /стрижк|окрашив|волос|уклад|причес/i]];
    var seen = {};
    function level(i) {
      for (var k = 0; k < TRACKS.length; k++) if (TRACKS[k][1].test(i.name)) {
        var t = TRACKS[k][0], total = D.items.filter(function (j) { return TRACKS[k][1].test(j.name); }).length;
        seen[t] = (seen[t] || 0) + 1;
        return total < 2 || x.plainLevels ? t : t + (seen[t] === 1 ? ", база" : ", следующий уровень");
      }
      return x.levelDefault || "Курс";
    }
    var THEMES = x.cards || [["#2A1F1D", "#F6F0EC"], ["#E9C9C6", "#2A1F1D"], ["#5B4038", "#F6F0EC"], ["#FFFFFF", "#2A1F1D"], ["#B4566E", "#FFFFFF"]];

    var courses = D.items.map(function (i, n) {
      var th = THEMES[n % THEMES.length];
      return '<article class="course" style="--i:' + n + ';--bg-c:' + th[0] + ';--fg-c:' + th[1] + '"><div class="ph">' + Core.pic(i) + '</div><div class="in">' +
        '<span class="lvl">' + e(level(i)) + '</span><h3>' + e(i.name) + '</h3>' + (i.desc ? '<p>' + e(i.desc) + '</p>' : '') +
        '<div class="row"><span class="price">' + Core.money(i.price) + (i.tag ? '<small>' + e(i.tag) + '</small>' : '') + '</span><button class="add" data-add="' + e(i.id) + '">' + e(D.sections.addLabel || "Выбрать курс") + '</button></div></div></article>';
    }).join("");

    var pills = (x.services || []).map(function (s) {
      return '<a href="' + Core.wa("Здравствуйте! Хочу записаться: " + s) + '" target="_blank" rel="noopener">' + e(s) + '</a>';
    }).join("");

    var rows = Core.contacts().map(function (r) {
      var inner = '<small>' + e(r[0]) + '</small><strong>' + e(r[1]) + '</strong>';
      return r[2] ? '<a href="' + e(r[2]) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div>' + inner + '</div>';
    }).join("");

    // Разметка в координатах фото 1200×801: начало, изгиб и кончик брови
    var shot = '<figure class="shot" style="margin:0"><div class="inner">' + (hp ? '<img src="' + e(hp) + '" alt="' + e(x.heroAlt || "Брови и ресницы, работа студии") + '">' : '') +
      (x.lines === false ? '' : '<svg viewBox="0 0 1200 801" aria-hidden="true">' +
        '<line class="l1" x1="150" y1="560" x2="150" y2="140"/><line class="l2" x1="170" y1="801" x2="639" y2="70"/><line class="l3" x1="170" y1="801" x2="976" y2="210"/>' +
        '<path class="l4" d="M150 292 Q 560 110 905 262"/>' +
        '<circle class="d1" cx="150" cy="292" r="12"/><circle class="d2" cx="588" cy="160" r="12"/><circle class="d3" cx="905" cy="262" r="12"/>' +
      '</svg>') + '</div></figure>';

    Core.mount(
      '<header class="top"><div class="wrap"><a class="logo" href="#top">' + e(D.brand.name) + '</a>' +
        '<button class="sel" data-open-cart>' + e(x.cartBtn || "Курсы") + ' <b data-count>0</b></button>' +
        (D.contacts.whatsapp ? '<a class="book" href="' + Core.wa("Здравствуйте! Хочу записаться") + '" target="_blank" rel="noopener">Записаться</a>' : '') + '</div></header>' +
      '<main id="top"><section class="hero">' + shot +
        '<div class="card"><h1>' + e(D.hero.title) + '</h1><p>' + e(D.hero.text) + '</p><a class="btn" href="#courses">' + e(D.hero.cta) + '</a>' +
        (pills ? '<a class="link" href="#services">' + e(x.svcLink || "Процедуры") + '</a>' : '') + '</div></section>' +
      '<section class="courses" id="courses"><div class="wrap"><h2>' + e(D.sections.catalogTitle) + '</h2><p class="lead">' + e(D.sections.catalogText) + '</p><div class="stack">' + courses + '</div></div></section>' +
      (pills ? '<section class="svc" id="services"><div class="wrap"><h2>' + e(x.svcTitle || "Процедуры в студии") + '</h2><p class="lead" style="margin-bottom:0">' + e(x.svcText || "Нажмите на процедуру, и мы подберём время. Стоимость зависит от техники и объёма, подскажем в WhatsApp.") + '</p><div class="pills">' + pills + '</div></div></section>' : '') +
      '<section class="about"><div class="wrap"><div class="box"><div><h2>' + e(D.sections.aboutTitle) + '</h2><p class="say" data-reveal>' + e(D.sections.aboutText) + '</p></div>' +
        '<ul>' + D.features.map(function (f) { return '<li data-reveal><strong>' + e(f.title) + '</strong><span>' + e(f.text) + '</span></li>'; }).join("") + '</ul></div></div></section>' +
      '<section class="find" id="contacts"><div class="wrap"><div class="box"><div><h2>Контакты</h2><p style="opacity:.7;margin:12px 0 22px">' + e(x.findText || "Ответим в WhatsApp, пришлём программу курса и свободные даты.") + '</p>' +
        (D.contacts.whatsapp ? '<a class="btn" href="' + Core.wa() + '" target="_blank" rel="noopener">Написать в WhatsApp</a>' : '') + '</div><div class="rows">' + rows + '</div></div></div></section></main>' +
      '<footer><div class="wrap"><span>© ' + new Date().getFullYear() + ' ' + e(D.brand.name) + (D.credits ? '. ' + e(D.credits) : '') + '</span><span><a href="admin.html">Вход для владельца</a>. Сайт сделан в <a href="https://instagram.com/shak.web" target="_blank" rel="noopener">shak.web</a></span></div></footer>'
    );
  })();
  </script>
</body>
</html>
