<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@font-face{font-family:Akt;src:url(Akt.ttf)}@font-face{font-family:Fin;src:url(Finlandica.ttf)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;background:#0E1018;color:#F0F2F8;font-family:Fin,sans-serif}
.s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px;text-align:center}
h1{font-family:Akt;font-size:118px;line-height:1.05;font-weight:700}
.blue{color:#4C8DFF}.dim{color:#8E94AC}
.sub{font-size:52px;line-height:1.3;margin-top:40px;color:#C9CEDF}
.num{font-family:Akt;font-size:44px;color:#4C8DFF;letter-spacing:2px;position:absolute;top:210px;left:0;right:0}
.q{font-size:72px;line-height:1.25;font-weight:600}
.q b{color:#fff;font-family:Akt;font-weight:700}
.ask{font-family:Akt;font-size:84px;margin-top:60px;color:#fff}
.timer{position:absolute;bottom:330px;left:140px;right:140px;height:22px;border-radius:11px;background:#1F2333;overflow:hidden}
.timer i{display:block;height:100%;background:#4C8DFF;border-radius:11px}
.tnum{position:absolute;bottom:380px;left:0;right:0;font-family:Akt;font-size:96px;color:#4C8DFF}
.ans{position:absolute;left:70px;right:70px;bottom:250px;background:#171A28;border:4px solid #4C8DFF;border-radius:40px;padding:50px 40px}
.ans .big{font-family:Akt;font-size:130px;color:#fff;line-height:1}
.ans .why{font-size:44px;line-height:1.3;color:#C9CEDF;margin-top:24px}
.ans .trap{font-size:40px;color:#FF6B6B;margin-top:18px}
.dots{position:absolute;top:120px;left:0;right:0;display:flex;gap:18px;justify-content:center}
.dots span{width:150px;height:12px;border-radius:6px;background:#1F2333}.dots span.on{background:#4C8DFF}
.src{position:absolute;bottom:110px;left:0;right:0;font-size:32px;color:#6A7090}
.bar{display:flex;align-items:flex-end;gap:36px;height:520px;margin-top:70px}
.bar div{width:190px;border-radius:20px 20px 0 0;background:#262B40;position:relative}
.bar div.hl{background:#4C8DFF}
.bar div b{position:absolute;top:-70px;left:0;right:0;font-family:Akt;font-size:54px}
.bar div u{position:absolute;bottom:-64px;left:-20px;right:-20px;font-size:36px;color:#8E94AC;text-decoration:none}
</style></head><body><div id="root"></div><script>
const Q=[
 {q:'Ракетка и мяч вместе стоят <b>1100 ₽</b>. Ракетка дороже мяча на <b>1000 ₽</b>.',ask:'Сколько стоит мяч?',a:'50 ₽',trap:'Первым в голову приходит 100 ₽',why:'Мяч 50, ракетка 1050. Вместе 1100.'},
 {q:'<b>5</b> станков за <b>5</b> минут делают <b>5</b> деталей.',ask:'За сколько минут 100 станков сделают 100 деталей?',a:'5 минут',trap:'Хочется ответить 100',why:'Один станок делает одну деталь за 5 минут.'},
 {q:'Кувшинки на озере каждый день занимают <b>вдвое больше</b> места. Всё озеро они закроют за <b>48 дней</b>.',ask:'За сколько дней закроют половину?',a:'47 дней',trap:'Рука тянется написать 24',why:'На следующий день половина удвоится.'}];
const INTRO=3.4,QT=6.4,AT=3.6,STEP=QT+AT,END0=INTRO+3*STEP;   // всего около 37,5 с
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const fade=(t,a,b,d=0.35)=>Math.max(0,Math.min(1,(t-a)/d,(b-t)/d));
const root=document.getElementById('root');
window.DUR=END0+4.6;
window.seek=function(t){
  let h='';
  if(t<INTRO){const o=fade(t,0,INTRO,0.3),k=ease(t/0.6);
    h=`<div class="s" style="opacity:${o}"><h1 style="transform:translateY(${(1-k)*60}px)">Тест из <span class="blue">3</span> вопросов</h1>
      <p class="sub" style="opacity:${ease((t-0.8)/0.5)}">Все три решают правильно<br>только <b style="color:#fff">17 из 100</b> человек</p>
      <p class="sub dim" style="opacity:${ease((t-1.8)/0.5)}">На каждый вопрос 5 секунд</p></div>`;
  } else if(t<END0){
    const i=Math.min(2,Math.floor((t-INTRO)/STEP)),lt=t-INTRO-i*STEP,q=Q[i];
    const o=fade(lt,0,STEP,0.3),kq=ease(lt/0.5),left=Math.max(0,5-(lt-1.2)),inQ=lt<QT;
    const ka=ease((lt-QT)/0.45);
    h=`<div class="s" style="opacity:${o};justify-content:flex-start;padding-top:330px">
      <div class="dots">${[0,1,2].map(j=>`<span class="${j<=i?'on':''}"></span>`).join('')}</div>
      <div class="num">ВОПРОС ${i+1} ИЗ 3</div>
      <p class="q" style="opacity:${kq};transform:translateY(${(1-kq)*40}px)">${q.q}</p>
      <p class="ask" style="opacity:${ease((lt-0.7)/0.5)}">${q.ask}</p>
      ${inQ&&lt>1.2?`<div class="tnum">${Math.ceil(left)}</div><div class="timer"><i style="width:${left/5*100}%"></i></div>`:''}
      ${!inQ?`<div class="ans" style="opacity:${ka};transform:translateY(${(1-ka)*80}px) scale(${0.94+0.06*ka})"><div class="big">${q.a}</div><div class="why">${q.why}</div><div class="trap">${q.trap}</div></div>`:''}
    </div>`;
  } else {
    const lt=t-END0,o=ease(lt/0.4),g=ease((lt-0.5)/1.0);
    const B=[[33,'0 из 3'],[28,'1'],[23,'2'],[17,'3 из 3']];
    h=`<div class="s" style="opacity:${o}"><h1 style="font-size:92px">Сколько у вас<br>из трёх?</h1>
      <div class="bar">${B.map((b,j)=>`<div class="${j==3?'hl':''}" style="height:${b[0]/33*100*g}%"><b style="opacity:${g}">${b[0]}%</b><u>${b[1]}</u></div>`).join('')}</div>
      <p class="sub" style="margin-top:120px;opacity:${ease((lt-1.6)/0.5)}">Пишите результат в комментариях</p>
      <div class="src">Тест когнитивной рефлексии. Шейн Фредерик, 2005, 3 428 человек</div></div>`;
  }
  root.innerHTML=h;
};
seek(0);
</script></body></html>
