<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;background:radial-gradient(120% 70% at 50% 0%,#1d2a4a 0%,#121826 55%,#0c111c 100%);color:#fff;font-family:Manrope,sans-serif;position:relative;overflow:hidden}
h1{font-family:Unbounded,sans-serif;font-weight:800;letter-spacing:-.025em;line-height:1.05}
mark{background:#FFD23F;color:#121826;padding:0 .14em;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cap{position:absolute;left:0;right:0;top:96px;text-align:center;padding:0 60px}
.cap h1{font-size:78px;white-space:nowrap}
.cap p{font-size:38px;font-weight:700;color:#b9c3d6;margin-top:18px}
.chip{display:inline-block;margin-top:22px;background:#1F6BFF;color:#fff;font-weight:800;font-size:38px;padding:12px 30px;border-radius:999px}
.bezel{position:absolute;left:178px;top:348px;width:724px;height:1539px;border-radius:76px;background:#05070c;box-shadow:0 40px 120px rgba(31,107,255,.28),0 0 0 2px rgba(255,255,255,.08)}
.logo{position:absolute;right:40px;bottom:28px;font-family:Unbounded,sans-serif;font-size:30px;opacity:.0}
.card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
.card h1{font-size:118px}
.card p{font-size:46px;font-weight:700;color:#b9c3d6;margin-top:34px;line-height:1.3}
.brand{position:absolute;left:90px;bottom:110px;font-family:Unbounded,sans-serif;font-size:44px}
.brand i{color:#1F6BFF;font-style:normal}
.price{font-family:Unbounded,sans-serif;font-size:190px;font-weight:800;letter-spacing:-.04em;line-height:1}
.price small{font-size:96px}
.box{margin-top:46px;background:#FFD23F;color:#121826;border-radius:36px;padding:38px 44px;font-weight:800;font-size:50px;line-height:1.2}
.box small{display:block;font-size:36px;font-weight:700;margin-top:10px;opacity:.8}
</style></head>
<body><script>
const q = new URLSearchParams(location.search), t = q.get('t');
const b = document.body;
if (t === 'title') b.innerHTML = `<div class="card"><h1>Сайты,<br>которые<br><mark>продают</mark></h1><p>и которыми вы управляете сами</p></div><div class="brand">shak<i>.</i>web</div>`;
else if (t === 'end') b.innerHTML = `<div class="card"><p style="margin:0 0 14px;color:#fff">Сайт под ключ с админкой</p><div class="price">15 500 <small>₽</small></div><p style="margin-top:18px">Без предоплаты. Полный бриф: −1&nbsp;200&nbsp;₽</p><div class="box">Начните с брифа<small>ссылка в шапке профиля</small></div></div><div class="brand">shak<i>.</i>web</div>`;
else b.innerHTML = `<div class="cap"><h1>${q.get('h')}</h1>${q.get('p') ? `<p>${q.get('p')}</p>` : ''}${q.get('c') ? `<span class="chip">${q.get('c')}</span>` : ''}</div><div class="bezel"></div>`;
</script></body></html>
