<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:var(--ink)}
.glow{position:absolute;left:-300px;top:-200px;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(255,77,26,.16),rgba(255,77,26,0) 62%)}
.deep{position:absolute;right:-170px;top:360px;width:420px;perspective:1800px;z-index:1}
.deep .screen{position:relative;width:420px;margin-bottom:40px;border-radius:40px;opacity:.38;transform:rotateY(-24deg) rotateZ(4deg)}
.deep .screen img{width:420px}
.brand{position:absolute;left:66px;top:120px;color:var(--paper);font:700 36px "Ysabeau Office";letter-spacing:.06em;z-index:5}.brand b{color:var(--cinnabar)}
.kick{position:absolute;left:68px;top:250px;color:#cfc6bb;font-size:38px;font-weight:600;z-index:5}
.price{position:absolute;left:58px;top:300px;color:var(--paper);font-size:330px;white-space:nowrap;z-index:5}
.rub{position:absolute;left:835px;top:345px;color:var(--cinnabar);font-size:250px;z-index:5;clip-path:inset(0 100% 0 0)}
.rule{position:absolute;left:68px;top:650px;width:880px;height:2px;background:rgba(239,234,226,.25);transform-origin:left;z-index:5}
.note{position:absolute;left:68px;top:680px;color:#cfc6bb;font-size:38px;font-weight:600;line-height:1.45;z-index:5}
.note b{color:var(--paper)}
.q1,.q2{position:absolute;left:58px;color:var(--paper);font-size:200px;white-space:nowrap;z-index:5}
.q1{top:890px}.q2{top:1060px}
.a1{position:absolute;left:66px;top:1260px;color:var(--cinnabar);font-size:150px;line-height:.95;z-index:5;clip-path:inset(0 100% 0 0)}
.cta{position:absolute;left:62px;top:1610px;z-index:6;background:var(--cinnabar);color:var(--ink);font:800 64px "Sofia Sans Extra Condensed";text-transform:uppercase;letter-spacing:.01em;padding:26px 52px 24px;border-radius:999px;display:flex;gap:22px;align-items:center}
.cta span{display:inline-block;font-family:"Ysabeau Office";font-weight:700}
.url{position:absolute;left:70px;top:1765px;color:rgba(239,234,226,.72);font-size:34px;font-weight:600;letter-spacing:.01em;z-index:6}
</style></head><body>
<div class="glow" id="glow"></div>
<div class="deep" id="deep"><div class="screen"><img src="../assets/sites/the-rose-top.jpg"></div><div class="screen"><img src="../assets/sites/altyn-top.jpg"></div><div class="screen"><img src="../assets/sites/yummy-cake-top.jpg"></div></div>
<div class="brand" id="brand">shak<b>.</b>web</div>
<div class="kick" id="kick">Сайт под ключ</div>
<div class="price cond" id="price">15 500</div>
<div class="rub ital" id="rub">₽</div>
<div class="rule" id="rule"></div>
<div class="note" id="note"><b>Индивидуальный дизайн</b> и своя админка.<br>Полный бриф: −1 200 ₽</div>
<div class="q1 cond" id="q1">Есть идея</div>
<div class="q2 cond" id="q2">для сайта?</div>
<div class="a1 ital" id="a1">Давайте<br>воплотим её.</div>
<div class="cta" id="cta">Напишите мне <span>→</span></div>
<div class="url" id="url">trofimshakirov2081-lang.github.io/Shak.web</div>
<div class="grain" id="grain"></div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script><script src="engine.js"></script>
<script>
const P = splitChars(document.getElementById('price')), Q1 = splitChars(document.getElementById('q1')), Q2 = splitChars(document.getElementById('q2'));
TL.from('#glow', { scale: .6, opacity: 0, duration: 1.6, ease: 'sine.out' }, 0)
  .fromTo('#deep', { y: 260 }, { y: -320, duration: 6.6, ease: 'none' }, 0)
  .from('#deep', { opacity: 0, duration: 1, ease: 'sine.out' }, 0)
  .from(['#brand', '#kick'], { opacity: 0, y: 16, duration: .6, stagger: .1, ease: 'power3.out' }, .1)
  .from(P, { yPercent: 115, duration: .8, ease: 'power4.out', stagger: .045 }, .2)
  .to('#rub', { clipPath: 'inset(0 0% 0 0)', duration: .7, ease: 'power3.inOut' }, .75)
  .from('#rule', { scaleX: 0, duration: .8, ease: 'power3.inOut' }, .9)
  .from('#note', { opacity: 0, y: 20, duration: .6, ease: 'power3.out' }, 1.15)
  .from(Q1, { yPercent: 115, duration: .7, ease: 'power4.out', stagger: .03 }, 2.0)
  .from(Q2, { yPercent: 115, duration: .7, ease: 'power4.out', stagger: .03 }, 2.25)
  .to('#a1', { clipPath: 'inset(0 0% 0 0)', duration: .9, ease: 'power3.inOut' }, 3.0)
  .from('#a1', { x: -24, duration: .9, ease: 'power3.out' }, 3.0)
  .from('#cta', { y: 60, opacity: 0, scale: .92, duration: .7, ease: 'back.out(1.8)' }, 3.8)
  .from('#url', { opacity: 0, duration: .6, ease: 'sine.out' }, 4.2)
  .to('#cta', { scale: 1.04, duration: .35, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 5.2);
TL.set({}, {}, 6.6);
onFrame((t) => { const f = Math.floor(t * 30); document.getElementById('grain').style.transform = `translate(${(f * 37) % 120 - 60}px,${(f * 53) % 120 - 60}px)`; });
</script></body></html>
